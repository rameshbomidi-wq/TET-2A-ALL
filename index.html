d Veereswara at first. But his name was too long for children to call and so everybody started calling him Narendra. Answer the following. Why did everyone start calling the boy Narendra?","",["He was too tall.","His father named him so.","He himself changed his name.","His name was too long"],4,"వీరేశ్వర పేరు పిల్లలకు పిలవడానికి చాలా పొడవు కాబట్టి నరేంద్ర అని పిలిచారు."],[677,28,"Read the following. 'Dindi' in Andhra Pradesh is a perfect weekend destination with full of natural wonders. There are some adventurous achievements like 'Jet ski ride' and 'rope walking'. Answer the following: Which of the following adventurous activity is mentioned in the passage?","",["trekking","skiing","rope walking","cycling"],3,"గద్యంలో పేర్కొన్న సాహస కార్యకలాపం – rope walking."],[678,28,"Read the following. The thieves worked all night pulling water out of the well to get the box. By morning, they had waters all the plants for free. Answer the following. What did the thieves do to get the box?","",["They climbed down a rope.","They used a magnet.","They pulled all the water out of the well.","They waited for the well dry up."],3,"దొంగలు బావిలో నీళ్ళన్నీ బయటకు తోడారు (మొక్కలకు ఉచితంగా నీళ్ళు పారాయి)."],[679,28,"Read the following. Take a vessel and pour some water in it. Add some tea powder and milk to the water, Put the vessel on the stove. Answer the following: According to the text, what should be added to the water before putting the vessel on the stove?","",["Only sugar","Tea powder and milk","Only tea powder","Milk and Sugar."],2,"నీళ్ళలో టీ పొడి, పాలు కలపాలి."],[680,28,"Read the following. 'Dindi' is one of the lesser known and unexplored places in Andhra Pradesh located in the lap of the Godavari River. It is famous for the 'Back water of Andhra Pradesh.” Answer the following. Where is 'Dindi' located?","",["in the lap of Godavari River","in the western ghats","in the estren ghats","in Tamil Nadu"],1,"దిండి – గోదావరి నది ఒడిలో ఉంది."],[681,28,"Read the following. We went to the nearest historical town named Madanapalle where Rabindranath Tagore translated our National Anthem from Benagali to English, and Mrs. Margaret Cousins, a British woman, composed a tune for it at this very place. Answer the following. What did Mrs. Margaret Cousins do in Madanaplle?","",["She enjoyed the scenery.","She translated the National Anthem.","She named it a historical town.","She composed a tune for the National Anthem."],4,"మదనపల్లెలో ఆమె (మార్గరెట్ కజిన్స్) జాతీయ గీతానికి బాణీ కట్టింది."],[682,28,"Read the following. The lifeless hockey stick used to come alive in the hands of Dhayn chand. Some people stole his sticks to see whether they contained a special glue or magent. Answer the following. Why did some people steal Dhan chand's hockey sticks?","",["to see if they were new.","to see if they were broken","to see if there were magnets in them","to sell them in chor bazar."],3,"కర్రల్లో అయస్కాంతాలు ఉన్నాయేమోనని దొంగిలించారు."],[683,28,"Read the following. A rabbit forgot her name and asked many people for help. She visited a farmer, a potter, a barber, a tailor, a cobbler and a fisherman. Everyone was busy with their work. Answer the following. Choose the person whom the rabbit did not visit to find her name.","",["A cobbler","A washer man","A potter","A fisherman"],2,"గద్యంలో కుందేలు కలిసినవారి జాబితాలో చాకలి (washerman) లేడు."],[684,28,"Read the following. Once there was a little girl named Mia. She found a shiny blue box in the garden. She gave it to her mother. Answer the following. What did Mia find?","",["A little girl","A blue box","A garden","Her Mother"],2,"మియా తోటలో దొరికిన నీలి పెట్టెను తల్లికి ఇచ్చింది."],[685,28,"Read the following. A wood cutter and his wife had a loyal dog named Bruno who guarded their baby. One day, while the parents went to market, a wolf entered the hut and tried to attack the baby. Answer the following. Who tried to attack the baby?","",["The loyal dog","A wolf","A snake","Bruno"],2,"తోడేలు (wolf) బిడ్డ దగ్గరకు వచ్చింది."],[686,28,"Read the following. One day, while the farmer and his wife were away, a deadly snake crawled toward the baby's cradle. The brave mongoose fought and killed the snake to save the child. Answer the following. Why did the mongoose kill the snake?","",["to save the farmer.","to save the farmer's wife.","to save the child.","to save itself"],3,"ముంగిస బిడ్డను కాపాడటానికి పాముతో పోరాడింది."],[687,28,"Read the following. An old farmer named Somu had a large field full of stones. He wanted to plant seeds, but he was too tired to dig up all the heavy rocks himself. Answer the following. What was the main problem that the farmer Somu faced?","",["His field was full of heavy stones.","He had no seeds to plants.","He was old","There were no labourers."],1,"పొలం నిండా బరువైన రాళ్ళు ఉండటమే సోము సమస్య."],[688,28,"Read the following. Once there was a poor farmer who had a goose. Suddenly, the goose started laying a golden egg every day, and soon, the farmer become very rich. Now answer the following. How did the farmer have good fortune?","",["He had a lot of eggs","He sold his goose","His goose laid golden eggs","He sold his farm"],3,"బాతు రోజూ బంగారు గుడ్డు పెట్టడం వల్ల రైతు ధనవంతుడయ్యాడు."],[689,28,"Read the following. A poor farmer had a goose that laid a golden egg every day. Soon, he became very rich and greedy. He wanted to have all eggs at once. He cut the poor goose open, but there was nothing inside. His greediness resulted in grief. Answer the following. The farmer wanted to have all eggs ___.","",["every day","cooked","opened","at once"],4,"అత్యాశతో అన్ని గుడ్లూ ఒకేసారి (at once) కావాలనుకున్నాడు."],[690,28,"Read the following. A tree saw its friend, a river crying. The tree asked the river for the reason. The river said, “There is no water left in me. Everyone is dumping waste into me. I am going to die very soon.” Answer the following. Why was the river crying?","",["Its friend the tree was dying.","It was going to die.","There was a lot of water into it.","It was going to flow into a sea."],2,"నదిలో నీళ్ళు లేవు, అది చనిపోబోతోందని ఏడ్చింది."],[691,28,"Read the following. The day of the party drew near. Matilda became sadder. “I have absolutely no jewels,” she complained. Then her husband told her to borrow some jewels from her rich friend Jane. Answer the following: What was Matilda's complaint?","",["She had no jewels.","Her friend Jane had no jewels.","Her husband was angry with her.","Her friend is rich."],1,"మటిల్డా దగ్గర నగలు లేవు – అదే ఆమె బాధ."],[692,28,"Read the following. This is the day Mallika has been waiting for! It's neither a festival nor her birthday. Todays is going to be her first day at school. Answer the following. What was the importance of the day?","",["It was Mallika's birthday.","It was a festival.","It was the school annual day.","It was Mallika's first day at school."],4,"మల్లిక ఎదురుచూసిన రోజు – బడిలో మొదటి రోజు."],[693,28,"Read the following. Equality is giving equal rights and opportunities to everyone. Gender equality means that woman and men, girls and boys enjoy the same rights, resources and opportunities. Answer the following. Gender equality means enjoying the same___","",["rights and resources only","resources and opportunities only","opportunities and rights only","rights, resources and opportunities"],4,"లింగ సమానత్వం = హక్కులు, వనరులు, అవకాశాలు అన్నీ సమానంగా."],[694,28,"Read the following. Women have less access to some benefits. Girls must be given importance in education. There should be equal rights to women as men in decision making. Gender equality prevents from harmful practices against women. Answer the following. Who should have rights in decision making?","",["Only women","Only men","Both women and men","Neither women nor men"],3,"సమాన హక్కులు స్త్రీలు, పురుషులు ఇద్దరికీ."],[695,28,"Read the following. A Khadi exhibition was held at Kakinada in Andhra Pradesh in 1923. A little girl was standing at the gate. She was told not let anyone in the exhibition hall without a ticket. Answer the following. What was the little girl's job?","",["to sell tickets.","to hold the exhibition.","to let people in who have no tickets.","to let people in who have tickets."],4,"టికెట్ ఉన్నవారిని మాత్రమే లోపలికి పంపమని చెప్పారు."],[696,28,"Read the following. In Delhi, a balloon race is held every year. A large number of huge and colourful balloons float in the air above the houses and tall buildings, with people standing in the baskets or gondolas, as are called, looking down upon us. Answer the following. How often does the balloon race held in Delhi?","",["once every year","twice a year","once every three months","once every two years"],1,"ఢిల్లీలో బెలూన్ రేస్ ప్రతి సంవత్సరం ఒకసారి."],[697,29,"Read the following. What is a house? It's brick and stone And wood that's hard Some windows glass And perhaps a yard Answer the following. The poet talking about ____","",["a glass","a house","a window","a family"],2,"కవి వర్ణిస్తున్నది ఇల్లు (house) – ఇటుక, రాయి, కలప."],[698,29,"Read the following. What is a home? It's loving and family And doing for others It's brothers and sisters And fathers and mothers. Answer the following. The poet is talking about","",["the relations and emotions at home","the lack of relations and emotions at home","the infrastructure of house","the hatred among the family"],1,"Home = ప్రేమ, కుటుంబం, బంధాలు, భావాలు."],[699,29,"Read the following. How bright on the blue Is a kite when it's new! With a dive and a dip `It snaps its tail Answer the following. How is the kite on the blue when it's new?","",["It's bright","It's like a tail","It's a snap","It's like the sky"],1,"కొత్త గాలిపటం నీలాకాశంలో ప్రకాశవంతంగా (bright) ఉంటుంది."],[700,29,"Read the following. Then soars like ship With only a sail As over tides Of wind it rides, Answer the following: Identify the rhyming words from the poem","",["soar-over","with- wind","tides- rides","sail- only"],3,"ప్రాస పదాలు: tides – rides (చివరి శబ్దం ఒకటే)."],[701,29,"Read the following. How bright on the blue Is a kite when it's new! But a raggeder thing You never will see When it flaps on a string In the top of a tree Answer the following. What does 'it' refer to in the poem?","",["top","tree","flap","kite"],4,"చెట్టు పైన తాడుకు చిక్కుకుని చినిగిపోయేది – గాలిపటం (kite)."],[702,29,"Read the following. I quarreled with my brother I don't know what about One thing led to another And somehow we fell out. Answer the following. Who are the people mentioned in the poem?","",["The poet only","Brother only","The poet and his brother","I, we and another person"],3,"గొడవ పడింది కవి, అతని సోదరుడు."],[703,29,"Read the following. The start of it was slight The end of it was strong, He said he was right, I knew he was wrong Answer the following. Identify the rhyming words from the poem.","",["end-said","slight- right","strong-start","slight-strong"],2,"ప్రాస పదాలు: slight – right."],[704,29,"Read the following. We hated one another. The afternoon turned black Then suddenly my brother Thumped me on the back, Answer the following. Why did poet's brother thumped on poet's back?","",["They hated one another","Poet's brother was strong","For fun sake","Accidentally happened"],3,"సోదరుడు సరదాకు (for fun) వీపుపై చరిచాడు – గొడవ ముగిసింది."],[705,29,"Read the following. Beauty is seen In the sunlight, The trees, the birds, Corn growing and people working Or dancing for their harvest. Answer the following. What are the people working and dancing for?","",["for the trees","for the birds","for the sunlight","for their harvest"],4,"పంట కోసం (for their harvest) ప్రజలు నాట్యం చేస్తున్నారు."],[706,29,"Read the following. Beauty is in yourself Good deeds, happy thoughts That repeat themselves In your dreams In your work And even in your rest. Answer the following. According to the poet , what are expected to repeat?","",["dreams","good deeds and happy thoughts","work and rest","rest and beauty"],2,"మనలోని అందం = మంచి పనులు, సంతోషకరమైన ఆలోచనలు."],[707,29,"Read the following. Never let a thought shrivel and die For want of a way to say it For English is a wonderful game And all of you can play it. Answer the following. Who can play the game mentioned in the poem?","",["Anyone","Players only","The English","The poet"],1,"ఇంగ్లీష్ అనే ఆటను ఎవరైనా (anyone) ఆడవచ్చు."],[708,29,"Read the following. Words are the food and dress of thought They give it its body and swing And everyone's longing today to hear Some fresh and beautiful thing; Answer the following. What are food and dress of thought?","",["Its body and swing","Everyone's longing","Beautiful things","Words"],4,"ఆలోచనకు ఆహారం, దుస్తులు = పదాలు (words)."],[709,29,"Read the following. But only words can free a thought From its prison behind your eyes May be your mind is holding now A marvelous new surprise! Answer the following What can free a thought?","",["Only words","Only eyes","A prison","A new Surprise"],1,"ఆలోచనను బంధం నుండి విడిపించేవి పదాలు మాత్రమే."],[710,29,"Read the following. He wished only to borrow; He'd repay it tomorrow. If not, he must die of starvation and sorrow. Answer the following: What might happen to him if he cannot get help?","",["He might fly away.","He might fall asleep.","He might become a debtor.","He might die of starvation."],4,"అప్పు దొరకకపోతే ఆకలి, దుఃఖంతో చనిపోతానన్నాడు."],[711,29,"Read the following. Says the ant to the cricket, “I'm your Servant and friend, But we ants never borrow; we ants never lend.” Answer the following. Choose the incorrect statement.","",["Ants never borrow.","Ants never lend.","Ants are lazy.","The ant is a friend to the cricket."],3,"పద్యంలో చెప్పనిది / తప్పు: \"Ants are lazy\" (చీమలు కష్టజీవులు)."],[712,29,"Read the following. “Come and hire me” I cried while in the morning I was walking on the stone –paved road. Sword in hand the King came in his chariot. Answer the following What did the King have in his hand?","",["The stone","The sword","The chariot","Empty"],2,"రాజు చేతిలో కత్తి (sword) ఉంది."],[713,29,"Read the following. How can the bird that is born for joy, Sit in the cage and sing, How can a child when fears annoy, But drop his tender wing, And forget his youthful spring . Answer the following. In the poem, a child is compared to___","",["a free bird","a joyful bird","a caged bird","a singing bird"],3,"సంతోషం కోసం పుట్టిన పక్షి పంజరంలో బందీ – caged bird."],[714,29,"Read the following. Ah! at times I drooping sit, And spend many an anxious hour. Nor in my book can I take delight, Nor sit in learning's bower, Worn thro' with the dream shower. Answer the following. Where does the child find joy?","",["In his books","In the learning's bower","Neither in his books nor in the learning's bower","In dreany shower"],3,"పుస్తకాల్లో గానీ, చదువులో గానీ ఆనందం పొందలేడు."],[715,29,"Read the following. But go to school in a summer morn, O! it drives all joy away, Under a cruel eye out worn, The little spend the day, In singing and dismay. Answer the following. How does the child spend the day?","",["with happiness","with delight","in sorrow","in excitement"],3,"వేసవి ఉదయం బడికి వెళ్ళడం – పిల్లలు దుఃఖంతో (in sorrow) రోజు గడుపుతారు."],[716,29,"Read the following. The way a crow Shook down on me The dust of snow from a hemlock tree. Answer the following. What is the tree mentioned in the poem?","",["snow tree","mango tree","hemlock tree","heavenly tree"],3,"పద్యంలోని చెట్టు – hemlock tree."],[717,29,"Read the following. He hears the last voice at night, The patrolling cars, and stares with his brilliant eyes, At the brilliant stars. Answer the following. What is the last voice heard at night?","",["The sound of the people","The sound of the train","The sound of the patrolling cars","The brilliant stars"],3,"రాత్రి చివరగా వినిపించేది – పెట్రోలింగ్ కార్ల శబ్దం."],[718,29,"Read the following. But he's locked in the concrete cell, His strength behind bars, Stalking the length of the cage, Ignoring visitors. Answer the following. Where was he kept?","",["in a garden","in a cage","in the village","in his own village"],2,"పులి బోనులో (cage) బందీగా ఉంది."],[719,29,"Read the following. Don't bite your nails, Amande! Don't hunch your shoulders, Amande! Stop that slouching and sit straight, Amande! Answer the following. Choose the correct statement based on the above lines.","",["The child is encouraged to bite nails.","The child is restricted and controlled.","The child is given freedom.","The parent or the speaker is restricted."],2,"\"Don't … !\" అనే వరుస ఆజ్ఞలు – పిల్లను కట్టడి చేసి నియంత్రిస్తున్నారు."],[720,29,"Read the following. The trees inside are moving out into the forest, The forest that was empty all these days Where no bird could sit No insect hide. Answer the following. Where are the trees going?","",["They are going inside the house.","They are going into the forest","They are going into the town","They are going to the neighboring house."],2,"ఇంట్లోని చెట్లు అడవిలోకి వెళ్తున్నాయి."]],"concepts":["Synonym = ఒకే అర్థం వచ్చే పదం.\nఎలా సాధించాలి:\n1) ఇచ్చిన వాక్యంలో పదం అర్థం ముందు తెలుగులో ఊహించండి.\n2) ఆప్షన్లలో వ్యతిరేకార్థాలను (antonyms) ముందుగా తొలగించండి – సాధారణంగా 2–3 ఆప్షన్లు వ్యతిరేక పదాలే ఉంటాయి.\n3) మిగిలిన పదాన్ని వాక్యంలో పెట్టి చదవండి – అర్థం మారకపోతే అదే జవాబు.\nఉదా: seldom (అరుదుగా) = rarely; often, frequently వ్యతిరేకాలు.","Antonym = వ్యతిరేక అర్థం వచ్చే పదం.\nఎలా సాధించాలి:\n1) ఆప్షన్లలో synonyms (అదే అర్థం) ఎక్కువ ఉంటాయి – వాటిని తొలగించండి.\n2) un-, in-, im-, il-, ir-, dis-, mis- వంటి ఉపసర్గలు వ్యతిరేకార్థం ఇస్తాయి: kind–unkind, possible–impossible, legal–illegal, regular–irregular, honest–dishonest.\n3) జంటలుగా గుర్తుపెట్టుకోండి: send–receive, lead–follow, accept–reject, suddenly–gradually, expensive–cheap.","Spelling నియమాలు:\n1) i before e except after c: believe, shriek; కానీ receive, ceiling.\n2) రెట్టింపు హల్లు: ఒక అచ్చు + ఒక హల్లుతో ముగిసి ఒత్తు చివర ఉంటే -ing/-ed ముందు హల్లు రెట్టింపు: stop–stopped, begin–beginning.\n3) చివర 'e' తొలగింపు: make–making, write–writing (కానీ agree–agreeing).\n4) y → i: happy–happiness, carry–carried (అచ్చు ముందు y ఉంటే మారదు: play–played).\n5) -tion / -sion / -ssion: vacation, decision, passion.\n6) -able / -ible, -cious / -tious: responsible, delicious, ambitious – ఇవి చదివి గుర్తుపెట్టుకోవాలి.\n7) British spelling: favourite, colour, centre (TET పుస్తకాలు British అనుసరిస్తాయి).","One-word substitution = ఒక వాక్యం/పదబంధానికి బదులు ఒకే పదం.\nమూల పదాల (roots) సహాయంతో అర్థం ఊహించవచ్చు:\nbio = జీవితం (biography), auto = స్వయం (autobiography), graph = రాత, geo = భూమి, astro = నక్షత్రం, phil = ప్రేమ, anthropo = మానవుడు (philanthropist), mis = ద్వేషం (misogynist), mono = ఒకటి, poly = అనేక (polyglot), omni = అన్నీ (omnipresent), cent = వంద (centenarian), -cide = చంపడం, -logy = శాస్త్రం, -ist/-er = చేసేవాడు.\nవృత్తుల పదాలు: cobbler (చెప్పులు), porter (కూలీ), potter (కుమ్మరి), architect (ప్లాన్), pediatrician (పిల్లల వైద్యుడు).","Idiom = పదాల అసలు అర్థం కాకుండా ప్రత్యేక భావం ఇచ్చే పదబంధం. పదం పదం అనువదిస్తే అర్థం రాదు.\nఉదా: \"let the cat out of the bag\" అంటే పిల్లిని వదలడం కాదు – రహస్యం బయటపెట్టడం.\nఎలా సాధించాలి: వాక్య సందర్భం (context) చూసి భావం ఊహించండి. ముఖ్యమైనవి: white elephant (ఖర్చెక్కువ–ఉపయోగం తక్కువ), storm in a teacup (చిన్న విషయానికి పెద్ద గొడవ), drop in the ocean (చాలా తక్కువ), bite the bullet (కష్టం భరించడం), by hook or by crook (ఏదో ఒక విధంగా), at one's fingertips (పూర్తిగా తెలిసిన).","Phrasal verb = క్రియ + preposition/adverb (particle). particle మారితే అర్థం పూర్తిగా మారుతుంది.\nఉదా (look): look after = సంరక్షించు, look for = వెతుకు, look up = నిఘంటువులో చూడు, look into = దర్యాప్తు చేయు.\n(give): give up = మానేయు, give in = లొంగిపో, give away = దానం చేయు.\n(set): set off/out = ప్రయాణం మొదలుపెట్టు, set up = స్థాపించు.\n(make): make up for = నష్టం పూడ్చు, make it up = రాజీపడు, make out = అర్థం చేసుకో.\n(stay/keep): stay up = నిద్రపోకుండా ఉండు, stay in = ఇంట్లోనే ఉండు, keep away = దూరంగా ఉండు.\nచిట్కా: వాక్యంలో ఉన్న phrasal verb స్థానంలో ఆప్షన్ పెట్టి అర్థం సరిపోతుందో చూడండి.","Homophones = ఉచ్చారణ ఒకటే, స్పెల్లింగ్, అర్థం వేరు.\nఎలా సాధించాలి: ఖాళీ ముందు/వెనుక పదాలు చూసి ఏ భాషాభాగం కావాలో గుర్తించండి.\nముఖ్య జంటలు: hear (వినడం) – here (ఇక్కడ); their (వారి) – there (అక్కడ) – they're (they are); its (దాని) – it's (it is); peace (శాంతి) – piece (ముక్క); weak (బలహీనం) – week (వారం); advice (నామవాచకం) – advise (క్రియ); accept (స్వీకరించు) – except (తప్ప); fair (సంత/న్యాయం) – fare (ఛార్జీ); meat – meet; sight – site – cite; two – to – too.","ఉపసర్గ (Prefix) పదం ముందు, ప్రత్యయం (Suffix) పదం వెనుక చేరుతుంది.\nవ్యతిరేకార్థ prefixes: un- (unpack), in- (inefficient), im- (p/b/m ముందు: impolite), il- (l ముందు: illegal), ir- (r ముందు: irregular), dis- (dishonest), mis- (misuse). re- = మళ్ళీ (rewrite).\nSuffix తో భాషాభాగం మారుతుంది:\nనామవాచకం: -ness (weakness), -ment (improvement), -tion (action), -ity, -ence.\nవిశేషణం: -ful (painful – ఒకే l), -less (careless), -able (readable), -ous, -al, -ical (botanical).\nక్రియా విశేషణం: -ly (dangerously).\nStem/root: చివరి ప్రత్యయం తీసేస్తే మిగిలేది (forgetfulness → forgetful).\nCompound word = రెండు స్వతంత్ర పదాల కలయిక (blackboard, windmill, son-in-law).","Collocation = కొన్ని పదాలు సహజంగా కలిసే వస్తాయి – మరో పదం వాడితే తప్పు.\nmake vs do: సృష్టించేది/ఫలితం వచ్చేది → make (a decision, a mistake, a promise, an effort, progress); పని/కర్తవ్యం → do (homework, duty, exercise, a favour).\nఇతర ముఖ్య జంటలు: pay attention, take responsibility, play a role, deliver a speech, ask a question, have a discussion, fierce competition, regular exercise, wide knowledge, deeply disappointed, pursue dreams.\nచిట్కా: ఇవి నియమాలతో కాదు, పదే పదే చదివి గుర్తుపెట్టుకోవాలి.","Parts of Speech (8 భాషాభాగాలు):\n1) Noun – పేరు (Sachin, kabaddi, tailor, meat). -ing రూపం నామవాచకంగా వాడితే gerund (gardening).\n2) Pronoun – పేరుకు బదులు (he, she, we, it, they).\n3) Verb – చర్య/స్థితి (play, saw, wiped, is).\n4) Adjective – నామవాచకాన్ని వర్ణిస్తుంది (small hotel, brown ball).\n5) Adverb – క్రియ/విశేషణాన్ని వర్ణిస్తుంది, ఎక్కువగా -ly (carefully, regularly).\n6) Preposition – నామవాచకానికి ముందు వచ్చి స్థానం/సంబంధం తెలుపుతుంది (in, on, under, into).\n7) Conjunction – పదాలు/వాక్యాలు కలుపుతుంది (and, but, or, because).\n8) Interjection – భావోద్వేగం (Oh!, Hurrah!, Alas!).\nచిట్కా: ఒకే పదం వేర్వేరు వాక్యాల్లో వేర్వేరు భాషాభాగం కావచ్చు – వాక్యంలో దాని పని చూడాలి.","Articles: a, an (అనిర్దిష్ట), the (నిర్దిష్ట).\n'a' / 'an' – అక్షరం కాదు, మొదటి శబ్దం చూడాలి:\n• అచ్చు శబ్దం → an: an apple, an hour (h పలకదు), an honest man, an MLA (ఎమ్).\n• హల్లు శబ్దం → a: a university (యూ), a one-rupee coin (వన్), a European.\n'the' వాడేది:\n• ఒకే ఒక్కటి ఉన్నవి: the sun, the moon, the earth.\n• superlative: the best, the longest, the youngest.\n• ordinal: the first, the second.\n• వాద్యాలు: play the flute; నదులు, సముద్రాలు, పర్వత శ్రేణులు: the Ganga, the Himalayas.\n• ముందు చెప్పిన వస్తువు మళ్ళీ చెప్పినప్పుడు.\nArticle అవసరం లేనివి: పదార్థ నామవాచకాలు సాధారణ అర్థంలో (Sugar is sweet, Gold is costly), by + వాహనం/సాధనం (by bus, by cheque), ఆటలు (play cricket), భోజనాలు (have lunch).\nవృత్తి చెప్పేటప్పుడు 'a': She is a photographer.","Tenses – 12 రూపాలు (V1 = మూల రూపం, V2 = భూతకాలం, V3 = past participle):\nPresent: Simple – V1/V1+s (అలవాట్లు, సత్యాలు: always, usually, every day); Continuous – am/is/are + V-ing (now, look!, at present); Perfect – has/have + V3 (just, already, yet, ever); Perfect Continuous – has/have been + V-ing (since/for తో).\nPast: Simple – V2 (yesterday, ago, last year, in 1990); Continuous – was/were + V-ing; Perfect – had + V3; Perfect Continuous – had been + V-ing.\nFuture: will + V1 (tomorrow, next); will be + V-ing; will have + V3; will have been + V-ing.\nప్రశ్నలు: Simple Present – Do/Does + V1; Simple Past – Did + V1 (did తర్వాత ఎప్పుడూ V1).\nచిట్కా: వాక్యంలోని సూచక పదం (signal word) చూస్తే tense తెలిసిపోతుంది. yesterday తో has/have రాదు.","Active → Passive Voice మార్పు దశలు:\n1) Active లోని కర్మ (object) Passive లో కర్త అవుతుంది.\n2) Active లోని కర్త 'by + object రూపం' అవుతుంది (I→me, he→him, she→her, we→us, they→them).\n3) క్రియ ఎప్పుడూ V3; ముందు 'be' రూపం tense ప్రకారం:\nSimple Present: am/is/are + V3 | Present Continuous: am/is/are being + V3 | Present Perfect: has/have been + V3\nSimple Past: was/were + V3 | Past Continuous: was/were being + V3 | Past Perfect: had been + V3\nFuture: will be + V3 | Modals: can/must/should be + V3\nImperative: Let + object + be + V3 (Close the door → Let the door be closed).\n4) కొత్త కర్త ఏకవచనమా బహువచనమా చూసి is/are, was/were, has/have ఎంచుకోండి.\nఉదా: They are eating bananas → Bananas are being eaten by them.","Reported (Indirect) Speech నియమాలు:\n1) Reporting verb (said) భూతకాలంలో ఉంటే లోపలి tense ఒక అడుగు వెనక్కి: is/am→was, are→were, do/does→did, did→had done, has/have→had, will→would, can→could, may→might.\n2) సర్వనామాలు మారతాయి: I/my → he/his (చెప్పినవాడి ప్రకారం), you → he/she/me (విన్నవాడి ప్రకారం), we → they.\n3) సమయ/స్థల పదాలు: now→then, today→that day, tomorrow→the next day, here→there, this→that.\n4) వాక్య రకం ప్రకారం:\n• ప్రకటన → said that…\n• Yes/No ప్రశ్న → asked if/whether… (వాక్య క్రమంలో, ? ఉండదు)\n• Wh- ప్రశ్న → asked what/where… + subject + verb (what the price was)\n• ఆజ్ఞ → ordered/told + to + V1; వ్యతిరేకం → not to + V1\n• ఆశ్చర్యార్థకం → exclaimed (with joy/sorrow) that…","వాక్య రకాలు (Types of sentences):\n1) Declarative (Assertive) – విషయం చెప్పేది, full stop తో: She went home.\n2) Interrogative – ప్రశ్న, ? తో: Are they teachers?\n3) Imperative – ఆజ్ఞ, అభ్యర్థన, సలహా (కర్త 'you' కనిపించదు): Please open the door.\n4) Exclamatory – భావోద్వేగం, ! తో; What a/How తో మొదలవుతుంది: What a beautiful day!\nమార్పిడి: Negative → do/does/did + not + V1 (He has a car → He does not have a car). Negative Interrogative → Did she not tell…? / Didn't she tell…?","Linkers (Connectors) – రెండు ఆలోచనల సంబంధాన్ని బట్టి ఎంచుకోవాలి:\n• కూడిక: and, also, as well, besides, in addition, moreover.\n• విరుద్ధం: but, however, although/though, yet, on the contrary, on the other hand.\n• కారణం: because, as, since, owing to, due to.\n• ఫలితం: so, therefore, consequently, as a result.\n• ఉదాహరణ: for example, for instance.\n• షరతు: if, unless (= if not).\n• క్రమం: firstly, then, finally.\n• మాట మార్చడం: by the way, anyway.\nచిట్కా: రెండు వాక్యాల మధ్య సంబంధం (కారణం–ఫలితం? విరుద్ధం?) ముందు గుర్తించండి.","Modals – అర్థం (function) ఆధారంగా:\ncan → సామర్థ్యం (Ability); Can I…? అనుమతి (అనధికారికం)\ncould → గతంలో సామర్థ్యం; Could you…? మర్యాదపూర్వక అభ్యర్థన (Request)\nmay → అనుమతి (May I come in?); సంభావ్యత (It may rain)\nmight → తక్కువ సంభావ్యత\nmust → తప్పనిసరి (Compulsion), గట్టి నిర్ధారణ\nshould / ought to → సలహా (Advice), కర్తవ్యం\nwould you like…? → ఆఫర్ (Offer); Will you…? → అభ్యర్థన/ఆహ్వానం\nshall I/we…? → సూచన/ఆఫర్\nనియమం: modal తర్వాత ఎప్పుడూ V1 (s/ing/ed లేకుండా).","Subject–Verb Agreement నియమాలు:\n1) ఏకవచన కర్త → ఏకవచన క్రియ (is/was/has/V+s); బహువచనం → are/were/have/V1.\n2) A and B → బహువచనం (He and I were…). కానీ ఒకే వ్యక్తి/వస్తువు అయితే ఏకవచనం (The horse and carriage is…; The poet and singer is… – ఒకే 'the').\n3) Each, every, either, neither, everyone, many a → ఏకవచనం (Each of the boys was…; Many a man has…).\n4) Either…or / Neither…nor → దగ్గరి కర్త ప్రకారం (Neither the boys nor the father is…).\n5) A as well as B / with / along with / together with → మొదటి కర్త ప్రకారం (The cow as well as the horses eats…).\n6) 's' ఉన్నా ఏకవచనం: news, mathematics, physics, economics, పుస్తకం పేర్లు (Gulliver's Travels was…).\n7) There is + ఏకవచనం / There are + బహువచనం.\n8) Two-thirds of + నామవాచకం → ఆ నామవాచకం ప్రకారం.\n9) The cost/formation of + బహువచనం → ప్రధాన కర్త (cost) ప్రకారం ఏకవచనం.","Be / Do రూపాలు:\nBe: Present – I am; he/she/it/ఏకవచనం is; we/you/they/బహువచనం are. Past – I/he/she/it was; we/you/they were. Future – will be.\nDo: Present – do (I/we/you/they), does (he/she/it); Past – did (అందరికీ).\nచిన్న జవాబులు: Are you…? → Yes, I am / No, I'm not. Do you…? → Yes, I do / No, I don't. Is it…? → Yes, it is.\nచిట్కా: yesterday/last → was/were; tomorrow/next → will be; now/at the moment → am/is/are.","విశేషణాల క్రమం (Order of Adjectives) – OSASCOMP:\nOpinion (అభిప్రాయం: beautiful, lovely, smart) → Size (పరిమాణం: big, small, tiny) → Age (వయస్సు: old, new, young) → Shape (ఆకారం: round, square, oval) → Colour (రంగు: red, white) → Origin (దేశం: Indian, Japanese) → Material (పదార్థం: wooden, leather, iron) → Purpose (ఉపయోగం: sports car, kitchen table) → నామవాచకం.\nసంఖ్య (a, two, three) ఎప్పుడూ ముందే.\nఉదా: a lovely small old round red Japanese wooden tea table.\nగుర్తుపెట్టుకునే వాక్యం: \"OSASCOMP\" – ఓ సా స కో మ్ప్.","Transitive vs Intransitive verbs:\nక్రియకు \"ఏమిటి?\" లేదా \"ఎవరిని?\" అని ప్రశ్నించండి.\n• జవాబు (కర్మ/object) వస్తే → Transitive (సకర్మక): He lifted (what?) the box → Transitive.\n• జవాబు రాకపోతే → Intransitive (అకర్మక): She sat down; The baby cried; He walked all day → Intransitive.\nజాగ్రత్త: to the kitchen, beside him, all day వంటివి కర్మలు కావు (స్థానం/కాలం చెబుతాయి).\nఒకే క్రియ రెండు రకాలుగా వాడవచ్చు: He runs (Intransitive); He runs a shop (Transitive).","Question Tags నియమాలు:\n1) సానుకూల వాక్యం → వ్యతిరేక tag; వ్యతిరేక వాక్యం → సానుకూల tag.\n2) Tag లో వాక్యంలోని సహాయ క్రియ (is, are, was, has, can, will…) నే వాడాలి + సర్వనామం.\n3) సహాయ క్రియ లేకపోతే: Simple Present → don't/doesn't; Simple Past → didn't (She draws → doesn't she?; They went → didn't they?).\n4) ప్రత్యేకాలు: I am → aren't I?; Let's → shall we?; Imperative (Open the door) → will you?; This/That → it (That was nice, wasn't it?); Everyone/somebody → they.\n5) never, hardly, seldom, no ఉన్నవి వ్యతిరేక వాక్యాలు → సానుకూల tag.","Error Correction – వాక్యం ఇలా చెక్ చేయండి:\n1) Subject–verb agreement (ఏకవచనం/బహువచనం).\n2) Tense signal words (since/for → perfect continuous; yesterday → simple past; every day → simple present).\n3) Articles (an honest, a useful; nouns like iron/advice/information కు article ఉండదు).\n4) Prepositions: depend on, go home (to లేదు), next/last/tomorrow ముందు 'on' రాదు, since (ప్రారంభ బిందువు) vs for (కాల వ్యవధి).\n5) లెక్కించలేని నామవాచకాలకు 's' రాదు: advice, information, furniture, luggage.\n6) Comparatives: than తో -er/more; the + -est ఒక సమూహంలో.\n7) Stative verbs (own, know, like, believe) -ing రూపంలో రావు.\n8) One of / Neither of + బహువచన నామవాచకం + ఏకవచన క్రియ.","Clauses (ఉపవాక్యాలు):\n• Noun clause – క్రియకు కర్మగా/కర్తగా పనిచేస్తుంది; \"ఏమిటి?\" కి జవాబు; that, what, whether తో: I know what he wants; He said that he was ill.\n• Adjective (Relative) clause – ముందున్న నామవాచకాన్ని వర్ణిస్తుంది; who, which, where, whose తో: The boy who sits near me…; the house where I was born.\n• Adverb clause – ఎప్పుడు/ఎందుకు/ఎలా/ఏ షరతుపై అని చెబుతుంది; when, as soon as, before, after, because, as, since, if, although తో: As he was sick, he stayed home.\nచిట్కా: 'where/when' ముందు నామవాచకం (place, house, day) ఉంటే Adjective clause; లేకపోతే Adverb clause.\nConditionals: Zero – If + V1, V1 (సత్యాలు); First – If + present, will + V1 (సాధ్యం); Second – If + past, would + V1 (ఊహ); Third – If + had V3, would have V3 (గతంలో జరగనిది).","Punctuation & Capitalisation:\nCapital letters: వాక్య ప్రారంభం, 'I', వ్యక్తుల/స్థలాల/దేశాల పేర్లు (India, Amaravati), వారాలు, నెలలు (Monday, May), పుస్తకాలు/సినిమాల పేర్లు, బ్రాండ్లు (Samsung), సంక్షిప్తాలు (TET). సాధారణ పదాలు (cricketer, actor, capital) small letters.\nFull stop (.) – ప్రకటన చివర; indirect question చివర కూడా full stop.\nComma (,) – జాబితాలో అంశాల మధ్య (apples, grapes and nuts); direct speech ముందు (Somu said, \"…\").\nQuestion mark (?) / Exclamation (!) – quotation లోపల: \"Can I talk to you?\"\nApostrophe ('): It's = It is; its = దాని; children's (బహువచనం 's' లేని పదానికి 's), boys' (s ఉన్న బహువచనానికి ').","Writing discourses (రాత రూపాలు):\nLetter – Heading (చిరునామా + తేదీ) → Salutation (Dear Sir) → Body → Subscription (Yours sincerely/faithfully/obediently) → సంతకం. విద్యార్థి→ఉపాధ్యాయుడు: Yours obediently.\nE-mail / Invitation / Notice – సంక్షిప్తత (brevity), సరైన format. Notice = అధికారిక ప్రకటన.\nDiary – మొదటి వ్యక్తి (I), వ్యక్తిగత అనుభవాలు, ఆత్మపరిశీలన, భవిష్యత్తు ప్రణాళికలు.\nBiographical sketch – మూడవ వ్యక్తి (He/She), పొందిక (coherence).\nDescriptive paragraph – వర్ణన.\nConversation – పలకరింపుతో మొదలు, dialogue exchanges, discourse markers (well, actually, oh), linkers.","Dictionary (అక్షర) క్రమం:\n1) మొదటి అక్షరం పోల్చండి; అది ఒకటే అయితే రెండవది, తర్వాత మూడవది… ఇలా తేడా వచ్చే వరకు.\n2) చిన్న పదం పెద్ద పదంలో మొదటి భాగం అయితే చిన్నదే ముందు: scholar → scholarship; merci-ful → merci-less → mercy.\n3) ఉదా: department vs departure → d-e-p-a-r-t తర్వాత m < u → department ముందు.\n4) 'మొదటిది', 'చివరిది', 'రెండవది' – ప్రశ్న ఏం అడుగుతోందో జాగ్రత్తగా చదవండి.\nచిట్కా: ఆప్షన్లన్నీ పేపర్‌పై క్రమంగా రాసి చూడండి.","Silent letters (పలకని అక్షరాలు) – నియమాలు:\n• m తర్వాత b: lamb, tomb, comb, climb. • b తర్వాత t: debt, doubt, subtle.\n• మొదట్లో ps- లో p: psalm, psychology. • kn- లో k: knife, know. • wr- లో w: write, wrong.\n• g + n: align, reign, sign, foreign. • gh: high, night, eight.\n• h: hour, honest, rhyme, ghost. • t: castle, listen, whistle, often; ఫ్రెంచ్ పదాల చివర: ballet, debut, bouquet.\n• British ఉచ్చారణలో అచ్చు తర్వాత r: Saturday, parcel, modern, scarf, iron.\n• s: island, debris. • w: shawl (aw), sword, answer.","Reading Comprehension (గద్యం):\n1) ముందు ప్రశ్నలు చదవండి, తర్వాత గద్యం – అప్పుడు ఏం వెతకాలో తెలుస్తుంది.\n2) జవాబు సాధారణంగా గద్యంలో నేరుగా ఉంటుంది (keyword కోసం వెతకండి – పేర్లు, సంఖ్యలు, స్థలాలు).\n3) మీ సొంత అభిప్రాయం కాదు, గద్యంలో ఉన్నదే జవాబు.\n4) 'not', 'except', 'all of the above' వంటి పదాలు జాగ్రత్తగా చూడండి.","Reading Comprehension (పద్యం):\n1) పద్యం భావం (theme) ముందు గ్రహించండి – కవి దేని గురించి చెబుతున్నాడు?\n2) ప్రాస పదాలు (rhyming words) = పంక్తుల చివరి శబ్దాలు ఒకేలా: tides–rides, slight–right.\n3) కవితా పరికరాలు: simile (like/as తో పోలిక), metaphor (నేరుగా పోలిక), personification (వస్తువులకు మానవ లక్షణాలు).\n4) జవాబు పద్యంలోని పదాల ఆధారంగానే ఇవ్వాలి."]},"spte":{"name":"SA తెలుగు (ప్రత్యేక)","en":"Special Telugu","topics":["పద్యాలు & గద్యాలు – భావం","తెలుగు సాహిత్య చరిత్ర – కవులు, రచనలు","భాషా చరిత్ర & పదజాలం","కావ్య మీమాంస – రసం, ధ్వని, అలంకార శాస్త్రం","బాలవ్యాకరణం – సూత్రాలు","పాఠ్యపుస్తక పాఠాలు","పర్యాయ, నానార్థ, వ్యుత్పత్తి, ప్రకృతి–వికృతులు","వ్యాకరణం – సంధి, సమాసం, వాక్యం, ఛందస్సు, అలంకారం","తెలుగు బోధనా పద్ధతులు"],"qs":[[1,0,"విదలింప నుఱుకు సింగపుఁ / గొదమయు మదమలినగండకుంజరములపై / నిది బలశాలికి నైజము / గద తేజోనిధికి వయసు కారణమగునే — మదజలంతో మలినమైన చెక్కిళ్ళుగలది","",["సింహము","ఏనుగు","వరాహము","శ్వాసము"],2,""],[2,0,"సంపదలు గల్గుతఱి మహాజనుల హృదయ / మభినవోత్పలకోమలం బగుచు వెలయు; / నాపదలు వొందునపుడు మహామహీధ / రాశ్మ సంఘాత కర్కశంబై తనర్చు — మహాత్ముల మనస్సులు సంపదలు కల్గినప్పుడు ఇలా ఉంటాయి.","",["కలువ వలె మృదువుగా","పాషాణం వలె కఠినంగా","పాల వలె తెల్లగా","తీగ వలె పొడవుగా"],1,""],[3,0,"ధర్మేతర వర్తనులును / దుర్మంత్రులునైన జనుల దురితము లొందున్ / మర్మములు గలిచి కల్మష, / కర్ముల రోగములు పొందు కైవడి విప్రా! — దుర్మార్గులను బాధించేవి","",["పుణ్యాలు","రోగాలు","దుఃఖాలు","శాపాలు"],2,""],[4,0,"విదలింప నుఱుకు సింగపుఁ / గొదమయు మదమలినగండకుంజరములపై / నిది బలశాలికి నైజము / గద తేజోనిధికి వయసు కారణమగునే — పై పద్యం ఆధారంగా పరాక్రమ వంతులకు దీనితో పనిలేదు","",["కాలము","బలము","వయస్సు","బలగము"],3,""],[5,0,"సంపదలు గల్గుతఱి మహాజనుల హృదయ / మభినవోత్పలకోమలం బగుచు వెలయు; / నాపదలు వొందునపుడు మహామహీధ / రాశ్మ సంఘాత కర్కశంబై తనర్చు — ఆపదలు వచ్చినప్పుడు మహాత్ముల మనస్సులు ఇలా ఉంటాయి.","",["మృదువుగా","కఠినంగా","పట్టని విధంగా","తెలియనట్లు"],2,""],[6,0,"ధర్మేతర వర్తనులును / దుర్మంత్రులునైన జనుల దురితము లొందున్ / మర్మములు గలిచి కల్మష, / కర్ముల రోగములు పొందు కైవడి విప్రా! — ధర్మం తప్పిన వాళ్ళను, కుటిల ఆలోచన గలవాళ్ళను ఇవి కలచివేస్తాయి","",["పాపాలు","బంధాలు","గుణాలు","లౌకికాలు"],1,""],[7,0,"తిరుపతి వేంకటకవులు రచించిన పాండవోద్యోగ, విజయాది / నాటకాలను నేటికీ ప్రేక్షకులు ఆదరిస్తున్నారు. సాంఘిక / నాటకాలెన్ని వచ్చినా వీరి నాటకాలలో కలకండ పలుకులవంటి / పద్యాలు, సంభాషణలు తెలుగు వారికి మిక్కిలి / ప్రీతిపాత్రములైనాయి. మహాభారతంలో పాత్రలు, తెలుగు వారికి / మిక్కిలి సన్నిహితంగా వీరి నాటకాల్లో కన్పిస్తాయి. కవిత్వంలో / వ్యాకరణము, భాష విషయాల్లో స్వతంత్రతను వహించిన వీరు / కొన్ని అంశాల్లో ఆధునికతకు వ్యతిరేకులు. — కింది వానిలో సరికానిది గుర్తించండి","",["పాండవోద్యోగ, విజయాది నాటకాలను నేటికీ ప్రేక్షకులు ఆదరిస్తున్నారు.","మహాభారతంలో పాత్రలు, తెలుగు వారికి మిక్కిలి సన్నిహితంగా కన్పిస్తాయి.","అన్ని అంశాల్లో ఆధునికతకు వీరు వ్యతిరేకులు","వ్యాకరణము, భాషా విషయాల్లో స్వతంత్రత వహించారు."],3,""],[8,0,"ఆధునిక కాలంలో పురాణేతిహాసాలు రచించిన కవులు / పురాణాలను, భారత రామాయణాలను తెలుగులో రచించిన / వావిల కొలను, జనమంచి, శ్రీపాద కృష్ణమూర్తి శాస్త్రి ప్రభృతులు / సామాన్య ప్రజలకు పూర్వగ్రంథాల వైశిష్ట్యాన్ని తెలియజెప్పారు. / ఆధునిక కవిత్వానికి, పూర్వ కవిత్వానికి గల వ్యత్యాసాలను అర్థం / చేసుకోవటానికి వీరి రచనలు తోడ్పడ్డాయి. ఈ విధంగా వీరి / రచనలు నవ్య సాహిత్య వికాసానికి పరోక్షంగా తోడ్పడ్డాయి. — పై పేరా ఆధారంగా ఆధునిక కాలంలో పురాణేతిహాసాలు రచించని కవులు","",["జనమంచి","శ్రీపాద కృష్ణమూర్తి శాస్త్రి","దేవులపల్లి కృష్ణ శాస్త్రి","వావిల కొలను"],3,""],[9,0,"నిన్నటి యలవాటుననుసరించి జనులు మూఁగిరి. నేను గూడఁ / బోయి లోనఁ గూర్చుంటిని. “ఎండలప్పుడే మిగులఁ దీవ్రముగ / నున్నవి. వైశాఖమాసమున నెట్లుండునో?” యని నేని / యాదృచ్ఛికముగఁ బలుక నంతవఱకేమియు మాటలాడక / యేదియో తనలోఁ దానాలోచించు కొనుచుఁ దలవంచుకొని / కూరుచుండి యుండిన జంఘాల శాస్త్రి తటాలున లేచి యుపన్యాస / పీఠమెక్కి యిట్లు పలుకఁదొడగెను. కావా? ఎక్కువగుచునే / యున్నవి. ఇంకయు నెక్కువగును. భరించుటకు శక్యము కాకుండ / నెక్కువయగును. — జంఘాలశాస్త్రి ఆలోచన వీటిని గురించి ఉన్నది.","",["వానలు","ఎండలు","చలి","వరదలు"],2,""],[10,0,"తిరుపతి వేంకటకవుల నాటకాలలో పద్యాలను దీనితో పోల్చారు.","",["చెరుకు తీపి","కలకండ","తేనె","పనసతొన"],2,""],[11,0,"పురాణేతిహాసాల పేరా ఆధారంగా సరైన వాక్యం గుర్తించండి","",["శ్రీపాద కృష్ణమూర్తి శాస్త్రి భారత, రామాయణాలను తెలుగులో రచించలేదు.","నవ్య సాహిత్య వికాసానికి వీరి రచనలు ప్రత్యక్షంగా తోడ్పడ్డాయి.","ఆధునిక, పూర్వ కవిత్వాల వ్యత్యాసం తెలుసుకోవడానికి వీరి రచనలు తోడ్పడ్డాయి.","జనమంచి శేషాద్రిశర్మ మహాప్రస్థానం రాశాడు."],3,""],[12,0,"జంఘాలశాస్త్రి పేరాలో ప్రస్తావించిన మాసము","",["మాఘం","చైత్రం","వైశాఖం","కార్తీకం"],3,""],[13,1,"\"భోజరాజీయం\" కావ్యాన్ని రచించిన కవి","",["అనంతామాత్యులు","కొఱవి గోపరాజు","జక్కన","మంచెన"],1,""],[14,1,"\"ఆముక్తమాల్యద” ప్రబంధాన్ని రచించిన కవి","",["అల్లసాని పెద్దన","నంది తిమ్మన","శ్రీకృష్ణదేవరాయలు","మాదయగారి మల్లన"],3,""],[15,1,"కింది వానిలో పోతన రచన కానిద of Britaine","Duke of Austria"],1,""],[130,9,"In the Shakespearean play \"Twelfth Night\" Act 1, Scene 1 begins at:","",["The sea-coast","The Duke's palace","Olivia's house","A street"],2,""],[131,9,"\"Some are born great, some achieve greatness and some have greatness thrust upon them\". The above famous lines are taken from:","",["Hamlet","The Tempest","Twelfth Night","Othello"],3,""],[132,9,"The opening lines of the Shakespearean play \"Twelfth Night\" are:","",["What country, friends, is this?","I have sent after him.","The climate's delicate, the air most sweet.","If music be the food of love, play on."],4,""],[133,9,"Who plays dual role in the play \"The Importance of Being Earnest\"?","",["Algernon","Fairfax","Merriman","Jack"],4,""],[134,9,"Who is Merriman in the play \"The Importance of Being Earnest\"?","",["Manservant","Governess","Butler","Housemaid"],3,""],[135,9,"Who plays Piano in the beginning of the play \"The Importance of Being Earnest\"?","",["ALGERNON","LANE","JACK","LADY BRACKNELL"],1,""],[136,9,"Where does Algernon Moncrieff live? (The Importance of Being Earnest)","",["In Manor House","In Half-Moon street","In Thames Street","In Grosvenor street"],2,""],[137,9,"When Jack is forced to confess that he has no brother, what does he describe as a 'painful position' that he is 'inexperienced' in doing? (The Importance of Being Earnest)","",["Facing the anger of two young women","Managing his family estate","Breaking off an engagement","Speaking the absolute truth"],4,""],[138,9,"In the play \"The Importance of Being Earnest\" which is the only thing that consoles ALGERNON when he was in trouble?","",["Eating","Drinking","Chatting","Meditating"],1,""],[139,9,"Where does the banker keep the lawyer imprisoned during the fifteen-year bet? (The Bet)","",["A public state prison downtown","A small lodge in the banker's garden","A secret underground dungeon","A remote cabin"],2,""],[140,9,"How much money does the banker bet the lawyer that he cannot stay in confinement for the agreed time? (The Bet)","",["Two million rubles","One hundred thousand rubles","Ten million rubles","Five hundred thousand rubles"],1,""],[141,9,"How many years does the lawyer agree to spend in solitary confinement to win the bet? (The Bet)","",["5 years","10 years","15 years","20 years"],3,""],[142,9,"In R.K. Narayan's \"Engine Trouble\", what did the narrator win at the Gaiety show?","",["A pincushion","A sewing machine","A camera","A road engine"],4,""],[143,9,"What is the name of the imaginary town created by R.K. Narayan? (Engine Trouble)","",["Phalgudi","Thalgudi","Malgudi","Kalgudi"],3,""],[144,9,"Who performed the yogic feats in the story \"Engine Trouble\" by R.K. Narayan?","",["Swamiji","The Narrator","The Municipal Chairman","The Showman"],1,""],[145,10,"Which Governor General approved Macaulay's minutes on education in 1835?","",["William James","Lord Dalhousie","William Bentinck","William Mountbatten"],3,""],[146,10,"A polyglot is a person who is:","",["able to speak only one language","able to speak mother tongue fluently.","able to speak more than two languages","able to speak English only."],3,""],[147,10,"Which committee is also known as \"The University Education Commission\"?","",["Kothari Commission","NPE-1968","Secondary Education Commission","Dr. Sarvepalli Radhakrishnan Committee"],4,""],[148,10,"Which of the following is not the objective of teaching English?","",["To make learning an enjoyable activity.","To help learners read and understand simple words, sentences and passages.","To familiarize pupils with the spoken and written forms of English.","To punish the learners for improving fluency."],4,""],[149,10,"CCE is the paradigm shift in the teaching-learning process. CCE means...","",["Comprehensive Curriculum Efforts","Continuous Comprehensive Evaluation","Collective and Continuous Evaluation","Competitive Comprehensive Evaluation"],2,""],[150,10,"Which statement supports English language fluency enhancement at school level?","",["Writing homework regularly.","Establishing English Language Laboratory.","Using Only Charts.","Punishments given for wrongly spelt."],2,""],[151,10,"The full form of CABE:","",["Common Academic Board of Education","Central Academic Board of Education","Central Advisory Board of Education","Common Advisory Board on Education"],3,""],[152,10,"The \"Magna Carta of Indian Education\" is:","",["Kothari commission","Wood's Despatch","Yashpal Committee","NEP-2020"],2,""],[153,10,"English language has _____ distinct sounds or phonemes.","",["26","44","24","48"],2,""],[154,10,"S-O-S approach means:","",["Situational-Objective-structural approach.","Structural-Oral-Situational approach.","Situational-Oral-structural approach.","Structural-Objective-situational approach."],2,""],[155,10,"Which is not the feature of Audio- Lingual Method?","",["Repetition drill","Dialogue memorization","Transformation drill","Imagination"],4,""],[156,10,"Who proposed Bilingual method?","",["Robert Lado","Stephen Krashen","Lev Vygotsky","Dr. C.J. Dodson"],4,""],[157,10,"Which is not the feature of child- centered teaching?","",["Focuses on both meaning and form","Directs to solve the tasks and understand the language better.","Corporal punishments for wrong answers.","Develops curiosity, creativity and critical thinking."],3,""],[158,10,"The existing knowledge of the learner is called:","",["information","ego","schema","technology"],3,""],[159,10,"Who introduced \"The Input Hypothesis theory of Second language acquisition\"?","",["Charles Darwin","Ivan Pavlov","Stephen Krashen","Abraham Maslow"],3,""],[160,10,"Substitution table can be used to teach:","",["articles","structures","determiners","sounds"],2,""],[161,10,"The words which carry the meaning are called:","",["Content words","Passive words","Active voice","Structural Words"],1,""],[162,10,"Teachers correcting student's errors at a later time without mentioning any names is called:","",["Error tolerance","Error intolerance","Error finding","Fault finding"],1,""],[163,10,"Vowel glides are also known as:","",["consonants","punctuation","monophthongs","diphthongs"],4,""],[164,10,"The sounds /p/ and /b/ are:","",["Plosives","Nasals","Affricates","Laterals"],1,""],[165,10,"Identify the phonetic script for the given word: 'Cease'","",["/ci:s/","/tʃi:s/","/si:s/","/ki:s/"],3,""],[166,10,"'Syllabification' means:","",["join the vowels","break the word into syllables","identify the vowels","counting the syllables"],2,""],[167,10,"Identify the correct stress in the given word: 'engineer'","",["en'gineer","engine'er","engi'neer","'engineer"],3,""],[168,10,"We use falling intonation in:","",["Requests","Apologies","Greetings","Ordinary statements"],4,""],[169,10,"The expanded form of OHP is:","",["Overhead Pressure","Overhead Projector","Overhead Protection","Overhead Project"],2,""],[170,10,"Choose the authentic material from the following.","",["Textbook","Supplementary Reader","Railway ticket","Work book"],3,""],[171,10,"Teaching learning materials are used:","",["to make the classroom passive and inactive.","to increase the boredom and fatigue.","to suppress the innate abilities of the learners.","to motivate the learners and make them understand the concepts easily."],4,""],[172,10,"Steps involved in planning a poetry lesson:","",["Presentation, Appreciation, Preparation, Interpretation","Preparation, Presentation, Interpretation, Appreciation","Appreciation, Presentation, Interpretation, Preparation","Interpretation, Preparation, Appreciation, Presentation"],2,""],[173,10,"In linguistics, the word 'competence' refers to a person's:","",["knowledge of swimming","knowledge of playing","Subconscious Knowledge of rules governing the formation of speech","Subconscious memory of beliefs and habits"],3,""],[174,10,"Lesson planning begins with:","",["selection of teaching aids","strategies for developing skills","writing objectives of the lesson","evaluation"],3,""],[175,10,"The term 'curriculum' has been derived from the Latin word 'Currere'. It means:","",["Designing","Jumping","Race course","Play Ground"],3,""],[176,10,"RTE Act came into effect on:","",["1ˢᵗ January 2010","1ˢᵗ August 2010","1ˢᵗ April 2010","1ˢᵗ September 2010"],3,""],[177,10,"Identify the guiding principle that was not there in NCF-2005:","",["Child centered curriculum","Learning should be interesting and joyful","Encourage rote learning and by heart methods.","Learning takes place both within and outside school."],3,""],[178,10,"Which is not the quality of a good test?","",["Ambiguity","Validity","Reliability","Usability"],1,""],[179,10,"Assessment of learning is:","",["Self Assessment","Formative Assessment","Peer Assessment","Summative Assessment"],4,""],[180,10,"Which domain is not in Bloom's Taxonomy?","",["Cognitive","Affective","Psychomotor","Physiological"],4,""]],"concepts":["Synonym = ఒకే అర్థం వచ్చే పదం.\nఎలా సాధించాలి:\n1) ఇచ్చిన వాక్యంలో పదం అర్థం ముందు తెలుగులో ఊహించండి.\n2) ఆప్షన్లలో వ్యతిరేకార్థాలను (antonyms) ముందుగా తొలగించండి – సాధారణంగా 2–3 ఆప్షన్లు వ్యతిరేక పదాలే ఉంటాయి.\n3) మిగిలిన పదాన్ని వాక్యంలో పెట్టి చదవండి – అర్థం మారకపోతే అదే జవాబు.\nఉదా: seldom (అరుదుగా) = rarely; often, frequently వ్యతిరేకాలు.\n\nAntonym = వ్యతిరేక అర్థం వచ్చే పదం.\nఎలా సాధించాలి:\n1) ఆప్షన్లలో synonyms (అదే అర్థం) ఎక్కువ ఉంటాయి – వాటిని తొలగించండి.\n2) un-, in-, im-, il-, ir-, dis-, mis- వంటి ఉపసర్గలు వ్యతిరేకార్థం ఇస్తాయి: kind–unkind, possible–impossible, legal–illegal, regular–irregular, honest–dishonest.\n3) జంటలుగా గుర్తుపెట్టుకోండి: send–receive, lead–follow, accept–reject, suddenly–gradually, expensive–cheap.","Spelling నియమాలు:\n1) i before e except after c: believe, shriek; కానీ receive, ceiling.\n2) రెట్టింపు హల్లు: ఒక అచ్చు + ఒక హల్లుతో ముగిసి ఒత్తు చివర ఉంటే -ing/-ed ముందు హల్లు రెట్టింపు: stop–stopped, begin–beginning.\n3) చివర 'e' తొలగింపు: make–making, write–writing (కానీ agree–agreeing).\n4) y → i: happy–happiness, carry–carried (అచ్చు ముందు y ఉంటే మారదు: play–played).\n5) -tion / -sion / -ssion: vacation, decision, passion.\n6) -able / -ible, -cious / -tious: responsible, delicious, ambitious – ఇవి చదివి గుర్తుపెట్టుకోవాలి.\n7) British spelling: favourite, colour, centre (TET పుస్తకాలు British అనుసరిస్తాయి).","One-word substitution = ఒక వాక్యం/పదబంధానికి బదులు ఒకే పదం.\nమూల పదాల (roots) సహాయంతో అర్థం ఊహించవచ్చు:\nbio = జీవితం (biography), auto = స్వయం (autobiography), graph = రాత, geo = భూమి, astro = నక్షత్రం, phil = ప్రేమ, anthropo = మానవుడు (philanthropist), mis = ద్వేషం (misogynist), mono = ఒకటి, poly = అనేక (polyglot), omni = అన్నీ (omnipresent), cent = వంద (centenarian), -cide = చంపడం, -logy = శాస్త్రం, -ist/-er = చేసేవాడు.\nవృత్తుల పదాలు: cobbler (చెప్పులు), porter (కూలీ), potter (కుమ్మరి), architect (ప్లాన్), pediatrician (పిల్లల వైద్యుడు).","Idiom = పదాల అసలు అర్థం కాకుండా ప్రత్యేక భావం ఇచ్చే పదబంధం. పదం పదం అనువదిస్తే అర్థం రాదు.\nఉదా: \"let the cat out of the bag\" అంటే పిల్లిని వదలడం కాదు – రహస్యం బయటపెట్టడం.\nఎలా సాధించాలి: వాక్య సందర్భం (context) చూసి భావం ఊహించండి. ముఖ్యమైనవి: white elephant (ఖర్చెక్కువ–ఉపయోగం తక్కువ), storm in a teacup (చిన్న విషయానికి పెద్ద గొడవ), drop in the ocean (చాలా తక్కువ), bite the bullet (కష్టం భరించడం), by hook or by crook (ఏదో ఒక విధంగా), at one's fingertips (పూర్తిగా తెలిసిన).\n\nPhrasal verb = క్రియ + preposition/adverb (particle). particle మారితే అర్థం పూర్తిగా మారుతుంది.\nఉదా (look): look after = సంరక్షించు, look for = వెతుకు, look up = నిఘంటువులో చూడు, look into = దర్యాప్తు చేయు.\n(give): give up = మానేయు, give in = లొంగిపో, give away = దానం చేయు.\n(set): set off/out = ప్రయాణం మొదలుపెట్టు, set up = స్థాపించు.\n(make): make up for = నష్టం పూడ్చు, make it up = రాజీపడు, make out = అర్థం చేసుకో.\n(stay/keep): stay up = నిద్రపోకుండా ఉండు, stay in = ఇంట్లోనే ఉండు, keep away = దూరంగా ఉండు.\nచిట్కా: వాక్యంలో ఉన్న phrasal verb స్థానంలో ఆప్షన్ పెట్టి అర్థం సరిపోతుందో చూడండి.","ఉపసర్గ (Prefix) పదం ముందు, ప్రత్యయం (Suffix) పదం వెనుక చేరుతుంది.\nవ్యతిరేకార్థ prefixes: un- (unpack), in- (inefficient), im- (p/b/m ముందు: impolite), il- (l ముందు: illegal), ir- (r ముందు: irregular), dis- (dishonest), mis- (misuse). re- = మళ్ళీ (rewrite).\nSuffix తో భాషాభాగం మారుతుంది:\nనామవాచకం: -ness (weakness), -ment (improvement), -tion (action), -ity, -ence.\nవిశేషణం: -ful (painful – ఒకే l), -less (careless), -able (readable), -ous, -al, -ical (botanical).\nక్రియా విశేషణం: -ly (dangerously).\nStem/root: చివరి ప్రత్యయం తీసేస్తే మిగిలేది (forgetfulness → forgetful).\nCompound word = రెండు స్వతంత్ర పదాల కలయిక (blackboard, windmill, son-in-law).\n\nCollocation = కొన్ని పదాలు సహజంగా కలిసే వస్తాయి – మరో పదం వాడితే తప్పు.\nmake vs do: సృష్టించేది/ఫలితం వచ్చేది → make (a decision, a mistake, a promise, an effort, progress); పని/కర్తవ్యం → do (homework, duty, exercise, a favour).\nఇతర ముఖ్య జంటలు: pay attention, take responsibility, play a role, deliver a speech, ask a question, have a discussion, fierce competition, regular exercise, wide knowledge, deeply disappointed, pursue dreams.\nచిట్కా: ఇవి నియమాలతో కాదు, పదే పదే చదివి గుర్తుపెట్టుకోవాలి.\n\nHomophones = ఉచ్చారణ ఒకటే, స్పెల్లింగ్, అర్థం వేరు.\nఎలా సాధించాలి: ఖాళీ ముందు/వెనుక పదాలు చూసి ఏ భాషాభాగం కావాలో గుర్తించండి.\nముఖ్య జంటలు: hear (వినడం) – here (ఇక్కడ); their (వారి) – there (అక్కడ) – they're (they are); its (దాని) – it's (it is); peace (శాంతి) – piece (ముక్క); weak (బలహీనం) – week (వారం); advice (నామవాచకం) – advise (క్రియ); accept (స్వీకరించు) – except (తప్ప); fair (సంత/న్యాయం) – fare (ఛార్జీ); meat – meet; sight – site – cite; two – to – too.","Tenses – 12 రూపాలు (V1 = మూల రూపం, V2 = భూతకాలం, V3 = past participle):\nPresent: Simple – V1/V1+s (అలవాట్లు, సత్యాలు: always, usually, every day); Continuous – am/is/are + V-ing (now, look!, at present); Perfect – has/have + V3 (just, already, yet, ever); Perfect Continuous – has/have been + V-ing (since/for తో).\nPast: Simple – V2 (yesterday, ago, last year, in 1990); Continuous – was/were + V-ing; Perfect – had + V3; Perfect Continuous – had been + V-ing.\nFuture: will + V1 (tomorrow, next); will be + V-ing; will have + V3; will have been + V-ing.\nప్రశ్నలు: Simple Present – Do/Does + V1; Simple Past – Did + V1 (did తర్వాత ఎప్పుడూ V1).\nచిట్కా: వాక్యంలోని సూచక పదం (signal word) చూస్తే tense తెలిసిపోతుంది. yesterday తో has/have రాదు.\n\nArticles: a, an (అనిర్దిష్ట), the (నిర్దిష్ట).\n'a' / 'an' – అక్షరం కాదు, మొదటి శబ్దం చూడాలి:\n• అచ్చు శబ్దం → an: an apple, an hour (h పలకదు), an honest man, an MLA (ఎమ్).\n• హల్లు శబ్దం → a: a university (యూ), a one-rupee coin (వన్), a European.\n'the' వాడేది:\n• ఒకే ఒక్కటి ఉన్నవి: the sun, the moon, the earth.\n• superlative: the best, the longest, the youngest.\n• ordinal: the first, the second.\n• వాద్యాలు: play the flute; నదులు, సముద్రాలు, పర్వత శ్రేణులు: the Ganga, the Himalayas.\n• ముందు చెప్పిన వస్తువు మళ్ళీ చెప్పినప్పుడు.\nArticle అవసరం లేనివి: పదార్థ నామవాచకాలు సాధారణ అర్థంలో (Sugar is sweet, Gold is costly), by + వాహనం/సాధనం (by bus, by cheque), ఆటలు (play cricket), భోజనాలు (have lunch).\nవృత్తి చెప్పేటప్పుడు 'a': She is a photographer.\n\nClauses (ఉపవాక్యాలు):\n• Noun clause – క్రియకు కర్మగా/కర్తగా పనిచేస్తుంది; \"ఏమిటి?\" కి జవాబు; that, what, whether తో: I know what he wants; He said that he was ill.\n• Adjective (Relative) clause – ముందున్న నామవాచకాన్ని వర్ణిస్తుంది; who, which, where, whose తో: The boy who sits near me…; the house where I was born.\n• Adverb clause – ఎప్పుడు/ఎందుకు/ఎలా/ఏ షరతుపై అని చెబుతుంది; when, as soon as, before, after, because, as, since, if, although తో: As he was sick, he stayed home.\nచిట్కా: 'where/when' ముందు నామవాచకం (place, house, day) ఉంటే Adjective clause; లేకపోతే Adverb clause.\nConditionals: Zero – If + V1, V1 (సత్యాలు); First – If + present, will + V1 (సాధ్యం); Second – If + past, would + V1 (ఊహ); Third – If + had V3, would have V3 (గతంలో జరగనిది).\n\nModals – అర్థం (function) ఆధారంగా:\ncan → సామర్థ్యం (Ability); Can I…? అనుమతి (అనధికారికం)\ncould → గతంలో సామర్థ్యం; Could you…? మర్యాదపూర్వక అభ్యర్థన (Request)\nmay → అనుమతి (May I come in?); సంభావ్యత (It may rain)\nmight → తక్కువ సంభావ్యత\nmust → తప్పనిసరి (Compulsion), గట్టి నిర్ధారణ\nshould / ought to → సలహా (Advice), కర్తవ్యం\nwould you like…? → ఆఫర్ (Offer); Will you…? → అభ్యర్థన/ఆహ్వానం\nshall I/we…? → సూచన/ఆఫర్\nనియమం: modal తర్వాత ఎప్పుడూ V1 (s/ing/ed లేకుండా).\n\nQuestion Tags నియమాలు:\n1) సానుకూల వాక్యం → వ్యతిరేక tag; వ్యతిరేక వాక్యం → సానుకూల tag.\n2) Tag లో వాక్యంలోని సహాయ క్రియ (is, are, was, has, can, will…) నే వాడాలి + సర్వనామం.\n3) సహాయ క్రియ లేకపోతే: Simple Present → don't/doesn't; Simple Past → didn't (She draws → doesn't she?; They went → didn't they?).\n4) ప్రత్యేకాలు: I am → aren't I?; Let's → shall we?; Imperative (Open the door) → will you?; This/That → it (That was nice, wasn't it?); Everyone/somebody → they.\n5) never, hardly, seldom, no ఉన్నవి వ్యతిరేక వాక్యాలు → సానుకూల tag.","Active → Passive Voice మార్పు దశలు:\n1) Active లోని కర్మ (object) Passive లో కర్త అవుతుంది.\n2) Active లోని కర్త 'by + object రూపం' అవుతుంది (I→me, he→him, she→her, we→us, they→them).\n3) క్రియ ఎప్పుడూ V3; ముందు 'be' రూపం tense ప్రకారం:\nSimple Present: am/is/are + V3 | Present Continuous: am/is/are being + V3 | Present Perfect: has/have been + V3\nSimple Past: was/were + V3 | Past Continuous: was/were being + V3 | Past Perfect: had been + V3\nFuture: will be + V3 | Modals: can/must/should be + V3\nImperative: Let + object + be + V3 (Close the door → Let the door be closed).\n4) కొత్త కర్త ఏకవచనమా బహువచనమా చూసి is/are, was/were, has/have ఎంచుకోండి.\nఉదా: They are eating bananas → Bananas are being eaten by them.\n\nReported (Indirect) Speech నియమాలు:\n1) Reporting verb (said) భూతకాలంలో ఉంటే లోపలి tense ఒక అడుగు వెనక్కి: is/am→was, are→were, do/does→did, did→had done, has/have→had, will→would, can→could, may→might.\n2) సర్వనామాలు మారతాయి: I/my → he/his (చెప్పినవాడి ప్రకారం), you → he/she/me (విన్నవాడి ప్రకారం), we → they.\n3) సమయ/స్థల పదాలు: now→then, today→that day, tomorrow→the next day, here→there, this→that.\n4) వాక్య రకం ప్రకారం:\n• ప్రకటన → said that…\n• Yes/No ప్రశ్న → asked if/whether… (వాక్య క్రమంలో, ? ఉండదు)\n• Wh- ప్రశ్న → asked what/where… + subject + verb (what the price was)\n• ఆజ్ఞ → ordered/told + to + V1; వ్యతిరేకం → not to + V1\n• ఆశ్చర్యార్థకం → exclaimed (with joy/sorrow) that…\n\nSubject–Verb Agreement నియమాలు:\n1) ఏకవచన కర్త → ఏకవచన క్రియ (is/was/has/V+s); బహువచనం → are/were/have/V1.\n2) A and B → బహువచనం (He and I were…). కానీ ఒకే వ్యక్తి/వస్తువు అయితే ఏకవచనం (The horse and carriage is…; The poet and singer is… – ఒకే 'the').\n3) Each, every, either, neither, everyone, many a → ఏకవచనం (Each of the boys was…; Many a man has…).\n4) Either…or / Neither…nor → దగ్గరి కర్త ప్రకారం (Neither the boys nor the father is…).\n5) A as well as B / with / along with / together with → మొదటి కర్త ప్రకారం (The cow as well as the horses eats…).\n6) 's' ఉన్నా ఏకవచనం: news, mathematics, physics, economics, పుస్తకం పేర్లు (Gulliver's Travels was…).\n7) There is + ఏకవచనం / There are + బహువచనం.\n8) Two-thirds of + నామవాచకం → ఆ నామవాచకం ప్రకారం.\n9) The cost/formation of + బహువచనం → ప్రధాన కర్త (cost) ప్రకారం ఏకవచనం.\n\nParts of Speech (8 భాషాభాగాలు):\n1) Noun – పేరు (Sachin, kabaddi, tailor, meat). -ing రూపం నామవాచకంగా వాడితే gerund (gardening).\n2) Pronoun – పేరుకు బదులు (he, she, we, it, they).\n3) Verb – చర్య/స్థితి (play, saw, wiped, is).\n4) Adjective – నామవాచకాన్ని వర్ణిస్తుంది (small hotel, brown ball).\n5) Adverb – క్రియ/విశేషణాన్ని వర్ణిస్తుంది, ఎక్కువగా -ly (carefully, regularly).\n6) Preposition – నామవాచకానికి ముందు వచ్చి స్థానం/సంబంధం తెలుపుతుంది (in, on, under, into).\n7) Conjunction – పదాలు/వాక్యాలు కలుపుతుంది (and, but, or, because).\n8) Interjection – భావోద్వేగం (Oh!, Hurrah!, Alas!).\nచిట్కా: ఒకే పదం వేర్వేరు వాక్యాల్లో వేర్వేరు భాషాభాగం కావచ్చు – వాక్యంలో దాని పని చూడాలి.\n\nLinkers (Connectors) – రెండు ఆలోచనల సంబంధాన్ని బట్టి ఎంచుకోవాలి:\n• కూడిక: and, also, as well, besides, in addition, moreover.\n• విరుద్ధం: but, however, although/though, yet, on the contrary, on the other hand.\n• కారణం: because, as, since, owing to, due to.\n• ఫలితం: so, therefore, consequently, as a result.\n• ఉదాహరణ: for example, for instance.\n• షరతు: if, unless (= if not).\n• క్రమం: firstly, then, finally.\n• మాట మార్చడం: by the way, anyway.\nచిట్కా: రెండు వాక్యాల మధ్య సంబంధం (కారణం–ఫలితం? విరుద్ధం?) ముందు గుర్తించండి.\n\nవాక్య రకాలు (Types of sentences):\n1) Declarative (Assertive) – విషయం చెప్పేది, full stop తో: She went home.\n2) Interrogative – ప్రశ్న, ? తో: Are they teachers?\n3) Imperative – ఆజ్ఞ, అభ్యర్థన, సలహా (కర్త 'you' కనిపించదు): Please open the door.\n4) Exclamatory – భావోద్వేగం, ! తో; What a/How తో మొదలవుతుంది: What a beautiful day!\nమార్పిడి: Negative → do/does/did + not + V1 (He has a car → He does not have a car). Negative Interrogative → Did she not tell…? / Didn't she tell…?\n\nError Correction – వాక్యం ఇలా చెక్ చేయండి:\n1) Subject–verb agreement (ఏకవచనం/బహువచనం).\n2) Tense signal words (since/for → perfect continuous; yesterday → simple past; every day → simple present).\n3) Articles (an honest, a useful; nouns like iron/advice/information కు article ఉండదు).\n4) Prepositions: depend on, go home (to లేదు), next/last/tomorrow ముందు 'on' రాదు, since (ప్రారంభ బిందువు) vs for (కాల వ్యవధి).\n5) లెక్కించలేని నామవాచకాలకు 's' రాదు: advice, information, furniture, luggage.\n6) Comparatives: than తో -er/more; the + -est ఒక సమూహంలో.\n7) Stative verbs (own, know, like, believe) -ing రూపంలో రావు.\n8) One of / Neither of + బహువచన నామవాచకం + ఏకవచన క్రియ.","Reading Comprehension (గద్యం):\n1) ముందు ప్రశ్నలు చదవండి, తర్వాత గద్యం – అప్పుడు ఏం వెతకాలో తెలుస్తుంది.\n2) జవాబు సాధారణంగా గద్యంలో నేరుగా ఉంటుంది (keyword కోసం వెతకండి – పేర్లు, సంఖ్యలు, స్థలాలు).\n3) మీ సొంత అభిప్రాయం కాదు, గద్యంలో ఉన్నదే జవాబు.\n4) 'not', 'except', 'all of the above' వంటి పదాలు జాగ్రత్తగా చూడండి.","","",""]},"sphi":{"name":"SA हिंदी (Hindi)","en":"Special Hindi","topics":["पठन बोध (गद्यांश / पद्यांश)","वर्ण विचार","पर्यायवाची एवं विलोम शब्द","संधि","समास","संज्ञा, सर्वनाम, विशेषण","वाक्यांश के लिए एक शब्द एवं मुहावरे","उपसर्ग एवं प्रत्यय","वाक्य, कारक, वचन, लिंग, क्रिया","विराम चिह्न","तत्सम एवं तद्भव","पाठ्यपुस्तक के पाठ"],"qs":[[1,0,"तोसिया रसोई में गयी। वहाँ बहुत सारे रं गबिरं गे / मसाले रखे हुए थे। लाल मिर्च, जीरा, हल्दी, धनिया, / मेथी। — रसोई मे पीले रं ग की चीज क्या है?","",["मिर्ची","मेथी","जीरा","हल्दी"],4,""],[2,0,"तोसिया उठी और सपने को याद करने लगी। वह / एकदम से घबरा गयी। तोसिया सोचने लगी कि क्या / सचमुच रं ग गायब हो गये हैं? — तोसिया क्या सोच रही थी?","",["तोसिया की नींद खराब हुई।","तोसिया के सपने में सारे रं ग गायब हो गये हैं।","तोसिया को घबराने की आदत है।","तोसिया की तबीयत खराब हुई।"],2,""],[3,0,"दिवाकर कहता है, \"एक और दो तीन\" मीना कहती / है \"सपेरा बजाता बीन\" दिवाकर कहता है \"तीन / और चार सात\" मीना कहती है लाओ कलम दवात। — दिवाकर क्या सीख रहा है?","",["अंकों को जोडना","अंकों का भागहार","अंकों का व्यवकलन","अंकों का गुणकार"],1,""],[4,0,"आज इतवार का दिन है। दादाजी ने आज कु ल्फी / बनाने के लिए बहुत सारा दू ध मंगाया था। — कु ल्फी बनाने के लिए आवश्यक चीज क्या है?","",["पानी","इतवार","दू ध","मिर्ची"],3,""],[5,0,"कमली और सोगरु ने नदी से पानी ला कर घास को / दिया। घास हरी हो गयी। दोनों घास ले कर गाय के / पास गये। गाय ने घास खाकर दू ध दिया। — घास को हरी बनाने के लिए क्या चाहिए?","",["दू ध","गाय","बच्चे","पानी"],4,""],[6,0,"एक दिन शिकारी ने शिकार पकडने के लिए जाल / बिछाया। उस जाल में शेर फँ स गया। वह जोर जोर / से दहाडने लगा। जंगल में शेर की सहायता के लिए / कोई नही आया। चूहा भाग भाग कर वहाँ आया। — शिकार पकडने के लिए शिकारी क्या करता है?","",["शेर पकड लाता है","चूहों को भगाता है","जाल बिछाता है","पेड लगाता है"],3,""],[7,0,"माँ को अपने बेटे और किसान को अपने लहलहाते / खेत देखकर जो आनंद आता है, वही आनंद, बाबा / भारती को अपने घोडा देखकर आता था। — इस गद्यांश में किसान को कब आनंद आता है?","",["अपना खेत लहलहाने पर","अपने बेटे को देखने पर","अपना घोडा देखने पर","अपनी माँ को देखने पर"],1,""],[8,0,"खड्ग सिंह उस इलाके का डाकू था। लोग उसका / नाम सुनकर काँपते थे। सुलतान (घोडे) की कीर्ति / उसके कानों तक भी पहुँची। उसका हृदय उसे / देखने के लिए अधीर हो उठा। — किसका हृदय किसे देखने के लिए अधीर हो उठा <script>
const D=JSON.parse(document.getElementById('data').textContent);
const SUBS=Object.keys(D);
const EXAM=new Date(2026,9,10);
const LS='rai_tet2a_v1';
let S={cur:'mm',stat:{},stars:{}};
try{const s=JSON.parse(localStorage.getItem(LS)||'null');if(s)S=Object.assign(S,s);}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const key=(sub,n)=>sub+':'+n;
function q2o(sub,a){return{sub,n:a[0],t:a[1],q:a[2],qt:a[3],o:a[4],a:a[5],e:a[6],ot:a[7]||null};}
function allQ(sub){return D[sub].qs.map(a=>q2o(sub,a));}
function stOf(sub,n){return S.stat[key(sub,n)]||[0,0];}
function record(q,ok){const k=key(q.sub,q.n);const s=S.stat[k]||[0,0];ok?s[0]++:s[1]++;S.stat[k]=s;save();}

// countdown
(function(){const t=new Date();t.setHours(0,0,0,0);const d=Math.round((EXAM-t)/864e5);
  $('#days').textContent=d>0?d:(d===0?'నేడే':'✓');})();

function renderChips(){
  $('#subjects').innerHTML=SUBS.map(s=>`<button class="chip" aria-pressed="${s===S.cur}" data-s="${s}">${D[s].name}</button>`).join('');
  $('#subjects').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{S.cur=b.dataset.s;save();
renderModes();renderChips();home();});
}

function topicStats(sub,t){
  const qs=D[sub].qs.filter(a=>t===null||a[1]===t);let seen=0,ok=0,bad=0;
  qs.forEach(a=>{const s=stOf(sub,a[0]);if(s[0]||s[1]){seen++;if(s[1]&&!s[0])bad++;else if(s[0]>=s[1])ok++;else bad++;}});
  return{total:qs.length,seen,ok,bad};
}

function home(){
  $('#subjects').style.display=S.mode==='mock'?'none':'';
  if(S.mode==='mock'){mock();return;}
  mkStop();
  if(S.mode==='book'){book();return;}
  if(S.mode==='listen'){listen();return;}
  lsStop();
  timerStop();
  const sub=S.cur,d=D[sub],all=topicStats(sub,null);
  const wrongN=d.qs.filter(a=>{const s=stOf(sub,a[0]);return s[1]>0&&s[1]>=s[0];}).length;
  const starN=d.qs.filter(a=>S.stars[key(sub,a[0])]).length;
  const acc=all.seen?Math.round(all.ok/all.seen*100):0;
  let h=`<div class="summary">
    <div class="stat"><b>${all.seen}/${all.total}</b><span>ప్రాక్టీస్ చేసినవి</span></div>
    <div class="stat"><b>${acc}%</b><span>ఖచ్చితత్వం</span></div>
    <div class="stat"><b>${wrongN}</b><span>తప్పులు (రివిజన్)</span></div></div>
  <div class="bar">
    <button class="btn gold" id="mix">మిశ్రమ క్విజ్ – అన్ని టాపిక్స్</button>
    <button class="btn alt" id="wr" ${wrongN?'':'disabled'}>తప్పులు మళ్ళీ (${wrongN})</button>
    <button class="btn alt" id="st" ${starN?'':'disabled'}>★ బుక్‌మార్క్స్ (${starN})</button>
  </div>`;
  if(sub==='tel')h+=`<p class="note">తెలుగు PDF లో ఫాంట్ పాడైనందున, పేజీల నుండి ప్రశ్నలను యూనికోడ్‌లో మళ్ళీ టైప్ చేశాము. సమాధానాలు PDF కీ ప్రకారం.</p>`;
  else if(['spte','spen','sphi'].includes(sub))h+=`<p class="note">స్పెషల్ TET – SA 2A ప్రత్యేక సబ్జెక్టు (60 మార్కులు). ప్రశ్నలు, సమాధానాలు meebadi.in ప్రాక్టీస్ బ్యాంక్ కీ ప్రకారం.</p>`;
  else if(sub!=='mm'&&!d.qs.some(a=>a[7]))h+=`<p class="note">ఈ సబ్జెక్టు ప్రశ్నలు PDF నుండి ఆటోమేటిక్‌గా తీసుకున్నవి (కీ సమాధానాలతో). తెలుగు అనువాదం ఇంకా జోడించలేదు.</p>`;
  h+=`<h2>${d.name} – టాపిక్స్</h2>`;
  d.topics.forEach((tn,i)=>{
    const st=topicStats(sub,i);if(!st.total)return;
    const cls=st.seen===st.total?'done':(st.seen?'part':'');
    h+=`<div class="topic ${cls}"><div><h3>${esc(tn)}</h3><small>${st.total} ప్రశ్నలు • చేసినవి ${st.seen} • సరైనవి ${st.ok}</small></div>
      <div class="acts"><button class="btn small alt" data-study="${i}">చదువు</button><button class="btn small" data-quiz="${i}">క్విజ్</button></div>
      <div class="prog"><i class="g" style="width:${st.ok/st.total*100}%"></i><i class="r" style="width:${st.bad/st.total*100}%"></i></div></div>`;
  });
  app.innerHTML=h;
  $('#mix').onclick=()=>setup(null,'mix');
  $('#wr').onclick=()=>{const qs=allQ(sub).filter(q=>{const s=stOf(sub,q.n);return s[1]>0&&s[1]>=s[0];});startQuiz(qs,'తప్పుల రివిజన్',false);};
  $('#st').onclick=()=>study(allQ(sub).filter(q=>S.stars[key(sub,q.n)]),'బుక్‌మార్క్స్',0);
  app.querySelectorAll('[data-study]').forEach(b=>b.onclick=()=>{const t=+b.dataset.study;study(allQ(sub).filter(q=>q.t===t),d.topics[t],0);});
  app.querySelectorAll('[data-quiz]').forEach(b=>b.onclick=()=>setup(+b.dataset.quiz,'topic'));
  window.scrollTo(0,0);
}

function oT(q,i){return q.ot&&q.ot[i]&&q.ot[i]!==q.o[i]?q.ot[i]:'';}
function optHTML(q,i,cls,dis){const t=oT(q,i);return `<button class="opt ${cls}" data-i="${i}" ${dis?'disabled':''}><span class="n">${i+1}</span><span>${esc(q.o[i])}${t?`<small class="ote">${esc(t)}</small>`:''}</span></button>`;}
function ansTxt(q,i){const t=oT(q,i);return esc(q.o[i])+(t?' / '+esc(t):'');}

function cptHTML(sub,ti){const c=(D[sub].concepts||[])[ti];return c?`<details class="cpt"><summary>📘 కాన్సెప్ట్ / నియమం – పూర్తిగా చదవండి</summary><div>${esc(c).replace(/\n/g,'<br>')}</div></details>`:'';}

function qBody(s){const i=s.lastIndexOf(' — ');if(i>40){const p=s.slice(0,i).split(' / ').map(esc).join('<br>');return `<div class="psg">${p}</div><p class="qtext">${esc(s.slice(i+3))}</p>`;}return `<p class="qtext">${esc(s)}</p>`;}
function bindStar(q){$('#star').onclick=e=>{const k=key(q.sub,q.n);if(S.stars[k])delete S.stars[k];else S.stars[k]=1;save();e.currentTarget.classList.toggle('on');};}

  const q=list[idx];let revealed=!hideAns;

// QUIZ
let QZ=null,timerId=null;
function timerStop(){if(timerId){clearInterval(timerId);timerId=null;}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function setup(t,mode){

      <label>ప్రశ్నలు</label><div class="seg" id="on"><button aria-pressed="${!onlyNew}" data-v="0">అన్నీ</button><button aria-pressed="${onlyNew}" data-v="1">ఇంకా చేయనివి మొదట</button></div>
      <div class="bar" style="margin-top:18px"><button class="btn gold" id="go">క్విజ్ ప్రారంభించు</button></div></div>`;
    $('#bk').onclick=home;

    $('#go').onclick=()=>{
      let p=shuffle(pool);
      if(onlyNew){const nw=p.filter(q=>{const s=stOf(sub,q.n);return !s[0]&&!s[1];});const old=p.filter(q=>!nw.includes(q));p=nw.concat(old);}
      startQuiz(p.slice(0,cnt),label,tm);

}
function startQuiz(qs,label,timed){
  if(!qs.length){home();return;}
  QZ={qs:shuffle(qs),label,i:0,ans:[],timed,left:qs.length*60};
  timerStop();
  if(timed)timerId=setInterval(()=>{QZ.left--;const el=$('#tmr');if(el)el.textContent=fmt(QZ.left);if(QZ.left<=0){timerStop();result();}},1000);
  quizQ();
}
const fmt=s=>`${Math.floor(Math.max(s,0)/60)}:${String(Math.max(s,0)%60).padStart(2,'0')}`;
function quizQ(){
  const z=QZ,q=z.qs[z.i],done=z.ans[z.i]!==undefined;
  const correct=z.ans.filter((a,i)=>a===z.qs[i].a-1).length;
  app.innerHTML=`<div class="qhead"><button class="back" id="bk" style="margin:0">✕ ముగించు</button>
      <span>${z.i+1} / ${z.qs.length} • సరైనవి ${correct}</span>${z.timed?`<span class="timer" id="tmr">${fmt(z.left)}</span>`:''}</div>
    <div class="qbar"><i style="width:${(z.i+(done?1:0))/z.qs.length*100}%"></i></div>
    <div class="card">${qTop(q,z.label)}
      <div class="opts">${q.o.map((o,i)=>{let c='';if(done){if(i===q.a-1)c='ok';else if(i===z.ans[z.i])c='bad';}return optHTML(q,i,c,done);}).join('')}</div>
      ${done?explHTML(q):''}
      <div class="nav"><span></span>${done?`<button class="btn gold" id="nx">${z.i<z.qs.length-1?'తర్వాత →':'ఫలితం చూడు'}</button>`:'<button class="btn alt" id="sk">దాటవేయి</button>'}</div>
    </div>`;
  bindStar(q);
  $('#bk').onclick=()=>{if(confirm('క్విజ్ ముగించి ఫలితం చూడాలా?'))result();};
  if(!done){
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;z.ans[z.i]=i;record(q,i===q.a-1);quizQ();});
    $('#sk').onclick=()=>{z.ans[z.i]=-1;next();};
  }else $('#nx').onclick=next;
  function next(){if(z.i<z.qs.length-1){z.i++;quizQ();window.scrollTo(0,0);}else result();}
}
function result(){
  timerStop();
  const z=QZ;const n=z.qs.length;let ok=0;const wrong=[];
  z.qs.forEach((q,i)=>{if(z.ans[i]===q.a-1)ok++;else wrong.push([q,z.ans[i]]);});
  const att=z.ans.filter(a=>a!==undefined&&a>=0).length;
  const pct=Math.round(ok/n*100);
  const msg=pct>=80?'అద్భుతం! ఇదే జోరు కొనసాగించండి.':pct>=60?'బాగుంది. తప్పులను ఒకసారి రివైజ్ చేయండి.':'ఈ టాపిక్ మళ్ళీ చదువు మోడ్‌లో చూసి, మళ్ళీ ప్రయత్నించండి.';
  let h=`<div class="card"><div class="score"><b>${ok}/${n}</b><p>${pct}% • ప్రయత్నించినవి ${att}</p><p>${msg}</p></div>
    <div class="bar" style="justify-content:center"><button class="btn gold" id="again">మళ్ళీ ఇదే క్విజ్</button>
    ${wrong.length?'<button class="btn alt" id="rw">తప్పులు మాత్రమే మళ్ళీ</button>':''}<button class="btn alt" id="hm">టాపిక్స్</button></div>`;
  if(wrong.length){h+=`<h2>తప్పులు / వదిలినవి – వివరణ</h2>`;
    wrong.forEach(([q,a])=>{h+=`<div class="rev"><div><b>ప్ర.సం ${q.n}.</b> ${esc(q.q)}${q.qt?`<br><span style="color:var(--ink2)">${esc(q.qt)}</span>`:''}</div>
      ${a>=0&&a!==undefined?`<div class="w">మీ సమాధానం: (${a+1}) ${ansTxt(q,a)}</div>`:'<div class="w">వదిలేశారు</div>'}
      <div class="a">సరైనది: (${q.a}) ${ansTxt(q,q.a-1)}</div>${q.e?`<div class="note">${esc(q.e)}</div>`:''}</div>`;});}
  h+='</div>';app.innerHTML=h;
  $('#again').onclick=()=>startQuiz(z.qs,z.label,z.timed);
  $('#hm').onclick=home;
  if(wrong.length)$('#rw').onclick=()=>startQuiz(wrong.map(w=>w[0]),'తప్పుల రివిజన్',false);
  window.scrollTo(0,0);
}

let bkTerm='';
function hl(s,t){s=esc(s);if(!t)return s;const r=new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');return s.replace(r,m=>`<mark>${m}</mark>`);}
function bkBody(s,t){const i=s.lastIndexOf(' — ');if(i>40)return `<div class="psg">${s.slice(0,i).split(' / ').map(x=>hl(x,t)).join('<br>')}</div>${hl(s.slice(i+3),t)}`;return hl(s,t);}

// ===== LISTEN MODE (browser text-to-speech) =====
const synth=window.speechSynthesis||null;
let LS_={list:[],i:0,playing:false,queue:[],timer:null};
function lsVoice(lang){if(!synth)return null;const v=synth.getVoices();
  if(lang==='te')return v.find(x=>/^te/i.test(x.lang))||null;
  if(lang==='hi')return v.find(x=>/^hi/i.test(x.lang))||null;
  return v.find(x=>/^en-IN/i.test(x.lang))||v.find(x=>/^en-GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null;}
function lsStop(){LS_.playing=false;clearTimeout(LS_.timer);try{synth&&synth.cancel();}catch(e){}}
function lsCfg(){S.ls=S.ls||{};const c=S.ls[S.cur]||{t:-1,lang:'te',rate:1,i:0};S.ls[S.cur]=c;return c;}
function lsClean(s){return String(s||'').replace(/ \/ /g,', ').replace(/ — /g,'. ').replace(/[“”"]/g,'').replace(/–/g,' ').replace(/\s+/g,' ').trim();}
function lsParts(q,lang){
  if(S.cur==='sphi'){const k=q.a-1;return [['hi',`प्रश्न ${q.n}. ${lsClean(q.q)}`],['hi',`उत्तर: ${lsClean(q.o[k])}.`]];}
  const k=q.a-1,en=S.cur==='en'||S.cur==='spen';
  const teQ=q.qt&&q.qt!==q.q?q.qt:(S.cur==='tel'||S.cur==='spte'?q.q:''),teA=q.ot&&q.ot[k]?q.ot[k]:(S.cur==='tel'||S.cur==='spte'?q.o[k]:'');
  const out=[];
  if(en||lang==='en'||!teQ){out.push(['en',`Question ${q.n}. ${lsClean(q.q)}`]);out.push(['en',`Answer: ${lsClean(q.o[k])}.`]);if(en&&q.e&&lang!=='en')out.push(['te',lsClean(q.e)]);}
  else{out.push(['te',`ప్రశ్న ${q.n}. ${lsClean(teQ)}`]);out.push(['te',`సమాధానం: ${lsClean(teA)}.`]);
    if(lang==='both'){out.push(['en',`${lsClean(q.q)}. Answer: ${lsClean(q.o[k])}.`]);}}
  return out;
}
function lsChunks(parts){const res=[];parts.forEach(([l,s])=>{const seg=s.match(/[^.!?।,]+[.!?।,]?/g)||[s];let buf='';seg.forEach(x=>{if((buf+x).length>170){if(buf.trim())res.push([l,buf.trim()]);buf=x;}else buf+=x;});if(buf.trim())res.push([l,buf.trim()]);});return res;}
function lsSpeakNext(){
  if(!LS_.playing)return;
  if(!LS_.queue.length){ // item finished
    LS_.timer=setTimeout(()=>{if(!LS_.playing)return;if(LS_.i<LS_.list.length-1){LS_.i++;lsCfg().i=LS_.i;save();lsDraw();lsItem();}else{LS_.playing=false;lsDraw();}},900);return;}
  const [l,s]=LS_.queue.shift();const u=new SpeechSynthesisUtterance(s);
  const v=lsVoice(l);if(v){u.voice=v;u.lang=v.lang;}else u.lang=l==='te'?'te-IN':l==='hi'?'hi-IN':'en-IN';
  u.rate=lsCfg().rate;u.onend=()=>lsSpeakNext();u.onerror=()=>lsSpeakNext();
  synth.speak(u);
}
function lsItem(){try{synth.cancel();}catch(e){}LS_.queue=lsChunks(lsParts(LS_.list[LS_.i],lsCfg().lang));lsSpeakNext();}
function lsBuild(){const c=lsCfg();LS_.list=allQ(S.cur).filter(q=>c.t<0||q.t===c.t);LS_.i=Math.min(c.i||0,Math.max(0,LS_.list.length-1));}
function listen(){
  timerStop();lsStop();

}

  h+=`<div class="ls-card"><div class="ls-row"><label>టాపిక్</label><select id="lt"><option value="-1">అన్ని టాపిక్స్ (${d.qs.length})</option>${d.topics.map((tn,i)=>{const n=d.qs.filter(a=>a[1]===i).length;return n?`<option value="${i}" ${c.t===i?'selected':''}>${esc(tn)} (${n})</option>`:'';}).join('')}</select></div>
  ${en?'':`<div class="ls-row"><label>భాష</label><select id="ll"><option value="te" ${c.lang==='te'?'selected':''}>తెలుగు</option><option value="both" ${c.lang==='both'?'selected':''}>తెలుగు + English</option><option value="en" ${c.lang==='en'?'selected':''}>English</option></select></div>`}

  app.querySelectorAll('#mkf button').forEach(b=>b.onclick=()=>{F=b.dataset.f;app.querySelectorAll('#mkf button').forEach(x=>x.setAttribute('aria-pressed',x===b));list();});
