నానార్థాలు","వ్యుత్పత్త్యర్థాలు","ప్రకృతి – వికృతులు","జాతీయాలు","సామెతలు","పొడుపు కథలు","వర్ణమాల – అక్షర విభాగం","భాషాభాగాలు & విభక్తులు","సంధులు","సమాసాలు","ఛందస్సు","అలంకారాలు","వాక్యాలు & వాక్య మార్పిడి"],"qs":[[1,0,"అమరుఁజెవి శాస్త్రమునఁ గుండలమునఁ గాదు / వలయమున నొప్పు దీవిచే వెలయుఁబాణి / యురుదయాధ్యుల మేను పరోపకార / కలన రాణించు గంధంబు వలనఁ గాదు — పై పద్యం ఆధారంగా చెవులకు అలంకారము","",["శాస్త్రశ్రవణం","కుండలములు","తాటంకములు","కవచములు"],1,""],[2,0,"చేతులారంగ శివుని బూజింపడేని, / నోరు నొవ్వంగ హరికీర్తి నుడువడేని / దయయు సత్యంబు లోనుగా దలపడేని / గలుగ నేటికి దల్లుల కడుపు జేటు — పై పద్యం ఆధారంగా చేతులారా పూజించాల్సింది","",["హరిని","తల్లిని","శివుణ్ణి","తండ్రిని"],3,""],[3,0,"పరహితము సేయు నెవ్వడు / పరమ హితుండగును భూతపంచకమునకుం / బరహితమె పరమధర్మము / పరహితునకు నెదురు లేదు పర్వేందుముఖీ! — పై పద్యంలో పరమోత్తమ ధర్మం","",["భూతదయ","పరహితము","ధర్మానురక్తి","స్వీయానుభవం"],2,""],[4,0,"అక్క తల్లి చెల్లె లాత్మజ యెక్కిన / పాను పెక్కఁ జనదు పద్మనయన! / పరమయోగికైన బలిమిని నింద్రియ / గ్రామ మధికపీడఁ గలుగఁ జేయు — పై పద్యం ఆధారంగా పరమయోగులకైన తప్పనిది","",["ఇంద్రియ బాధ","ఇంద్రియబలం","సోదర ప్రేమ","సుతుల పీడ"],1,""],[5,0,"ద్వారబంధమునకు దలుపులు గడియలు / వలెనె నోటికొప్పుగల నియతులు / ధర్మమెఱిఁగి పలుక ధన్యుడౌ భువిలోన / విశ్వదాభిరామ వినురవేమ! — పై పద్యంలో గుమ్మాన్ని దీనితో పోల్చాడు","",["తలుపులు","నోరు","భువి","గడియలు"],2,""],[6,0,"పందు వలనఁ బుట్టెఁ బరగ ప్రపంచము / పందు వలనఁ బుట్టె పరము నిహము / పందు మేలెఱింగె బ్రహ్మాదులిలలోన / విశ్వదాభిరామ వినురవేమ! — పై పద్యం ఆధారంగా ఇహపరాలు దీనివలన పుట్టాయి","",["శాంతి వలన","సృష్టివలన","పందు వలన","లయమువలన"],3,""],[7,0,"తలనుండు విషము ఫణికిని / వెలయంగా దోకనుండు వృశ్చికమునకున్ / తలతోక యనక యుండును / ఖలునకు నిలువెల్ల విషము గదరా సుమతీ! — పద్యం ఆధారంగా నిలువెల్ల విషం కలవాడు","",["వృశ్చికం","ఫణి","ఖగుడు","ఖలుడు"],4,""],[8,0,"చేతులకు తొడవు దానము / భూతల నాథులకు తొడవు బొంకమి ధరలో / నీతియు తొడవెవ్వారికి / నాతికి మానంబు తొడవు నయముగ సుమతీ! — పై పద్యం ఆధారంగా చేతులకు అలంకారము","",["కార్యము","దానము","కంకణము","ఉంగరము"],2,""],[9,0,"తములము వేయని నోరును / విమతులతో జెలిమి సేసి వెతబడు తెలివిన్ / గమలములు లేని కొలకును / హిమధాముడు లేని రాత్రి హీనము సుమతీ! — ఇది లేని కొలను వ్యర్థమని కవి అన్నాడు","",["కప్పలు","చేపలు","తామరలు","నీళ్ళు"],3,""],[10,0,"మండలపతి సముఖంబున / మెండైన ప్రధాని లేక మెలగుట యెల్లన్ / గొండంత మదపుటేనుగు / తొండము లేకుండినట్లు తోచుర సుమతీ! — రాజువద్ద సమర్థుడైన ఇతడు ఉండకపోతే రాజ్యం వ్యర్థమన్నాడు కవి","",["సైనికుడి","సైన్యాధ్యక్షుడు","మంత్రి","కోశాధికారి"],3,""],[11,0,"బంగారు కుదువ బెట్టకు / సంగరమున బాఱిపోకు సరసుడవగుచో / నంగడి వెచ్చము లాడకు / వెంగలితో జెలిమి వలదు వినురా సుమతీ! — కవి ఇక్కడి నుండి పారిపోకూడదన్నాడు","",["బాధలు","యుద్ధాలు","కార్యాలు","ఇల్లు"],2,""],[12,0,"సద్గోష్ఠి సిరియు నొసగును / సద్గోష్ఠియె కీర్తి బెంచు సంతుష్టిని నా / సద్గోష్ఠియె యొనర గూర్చును / సద్గోష్ఠియె పాపములను జంపు కుమారా! — పై పద్యం యొక్క ప్రధాన ఉద్దేశం","",["సజ్జనులతో స్నేహం","దుర్జనుల సాంగత్యం","సాధుజనుల పీడనం","కాలం విలువ"],1,""],[13,0,"శ్రీభామినీ మనోహరు / సౌభాగ్యదయాస్వభావు సారసనాభున్ / లో భావించెద; నీకున్ / వైభవము లొసంగుచుండ వసుధ కుమారా! — పై పద్యం వీరిని కీర్తిస్తుంది","",["లక్ష్మీదేవి","మహావిష్ణువు","శంకరుడు","గణపతి"],2,""],[14,0,"ధనపతి సఖుడై యుండియు / నెనయంగా శివుడు భిక్షమెత్తఁగ వలసెన్ / దనవారి కెంతకలిగిన / దనభాగ్యమె తనకుగాక తథ్యము సుమతీ! — ధనపతి స్నేహితుడైనా భిక్షమెత్తినది","",["విష్ణువు","శివుడు","ఇంద్రుడు","బ్రహ్మ"],2,""],[15,0,"ఎండవెనుకె వాన నిండు హర్షము నిచ్చు / రేయి వెనుకె పగలు హాయినిచ్చు / బాధ వెనుకె సుఖము బహుళమై చెలగురా / వాస్తవమ్ము నాల్గవారి మాట — పై పద్యంలో అమిత సంతోషాన్ని ఇచ్చేది","",["వెలుగు తర్వాత చీకటి","ఎండ తర్వాత వాన","నిద్ర తర్వాత మెలకువ","పని తర్వాత విశ్రాంతి"],2,""],[16,0,"యోగులందెన్న వేమన యోగి యోగి / శిష్యులందెన్న సిద్ధప్ప సిద్ధమూర్తి / గురువులందెన్న శ్రీవీరగురుడు గురుడు / మతములందెన్న వేదాంత మతమె మతము — పై పద్యమాధారంగా యోగులలో గొప్పవారు","",["సిద్ధప్ప","వేమన","వేదాంతి","వీరగురుడు"],2,""],[17,0,"బహుళ కావ్యములను పరికింపగా వచ్చు / బహుళ శబ్దచయము బలుకవచ్చు / సహనమొక్కటబ్బ చాల కష్టంబురా / విశ్వదాభిరామ వినురవేమ! — పై పద్యం ఆధారంగా అత్యంత కష్టమైనది","",["ఓర్పు కలుగుట","విద్య కలుగుట","వినయం కలుగుట","కార్యజయం"],1,""],[18,0,"చిక్కియున్న వేళ సింహంబునైనను / బక్కకుక్క కఱచి బాధ చేయు / బలిమి లేని వేళ బంతంబు చెల్లదు / విశ్వదాభిరామ వినురవేమ — బలహీనమైన సింహాన్ని ఇది కూడా కరుస్తుంది","",["పాము","తేలు","కుక్క","చీమ"],3,""],[19,0,"వఱదైన చేను దున్నకు / కరువైనను బంధుజనుల కడకేఁగకుమీ / పరులకు మర్మము సెప్పకు / పిఱికికి దళవాయితనము బెట్టకు సుమతీ! — కరువు వచ్చినప్పుడు వీరి దగ్గరకు వెళ్ళకూడదు","",["చుట్టాలు","స్నేహితులు","సన్నిహితులు","శత్రువులు"],1,""],[20,0,"తాను భుజింపని యర్థము / మానవపతి జేరు గొంత మఱి భూగతమౌ / గానల నీగల గూర్చిన / తేనియ యొరు జేరునట్లు తిరముగ సుమతీ! — పై పద్యం ఆధారంగా తాను తినకుండా దాచిన సొమ్ము వీరికి చేరుతుంది","",["కొడుకు","రాజు","సతి","బంధువు"],2,""],[21,0,"కల్లనిజములెల్ల గరకంఠుడెఱుగును / నీరు పల్లమెఱుగు నిజముగాను / దల్లి తానెఱుగును దనయుని జన్మంబు / విశ్వదాభిరామ వినురవేమ! — పై పద్యం ఆధారంగా మనిషి ఆడే అబద్ధము నిజం వీరికి తెలుస్తుంది","",["గురువు","ఈశ్వరుడు","కుమారుడు","కాలం"],2,""],[22,0,"అమరుఁజెవి శాస్త్రమునఁ గుండలమునఁ గాదు / వలయమున నొప్పు దీవిచే వెలయుఁబాణి / యురుదయాధ్యుల మేను పరోపకార / కలన రాణించు గంధంబు వలనఁ గాదు — పై పద్యం ఆధారంగా దేహానికి అలంకారము కానిది","",["పరోపకారం","ఆభరణం","గంధం","వస్త్రం"],3,""],[23,0,"చేతులారంగ శివుని బూజింపడేని / నోరు నొవ్వంగ హరికీర్తి నుడువడేని / దయయు సత్యంబు లోనుగా దలపడేని / గలుగ నేటికి దల్లుల కడుపు జేటు — మనిషి వీటిని అలవర్చుకోవాలి","",["దయ, సత్యం","నిద్ర, ఆరోగ్యం","శుభ్రత, లేపనం","వినయం, విధేయత"],1,""],[24,0,"పరహితము సేయు నెవ్వడు / పరమ హితుండగును భూతపంచకమునకుం / బరహితమె పరమధర్మము / పరహితునకు నెదురు లేదు పర్వేందుముఖీ! — 'పంచభూతములు' అను అర్థము తెలిపే పదం","",["భూతపంచకం","పరమ హితుండు","పర్వేందుముఖీ","పరమధర్మం"],1,""],[25,0,"అక్క తల్లి చెల్లె లాత్మజ యెక్కిన / పాను పెక్కఁ జనదు పద్మనయన! / పరమయోగికైన బలిమిని నింద్రియ / గ్రామ మధికపీడఁ గలుగఁ జేయు — 'పద్మనయన' అనగా","",["పద్మముల వంటి కన్నులు గలది","కలువల వంటి కన్నులు గలది","సంపెంగల వంటి కన్నులు గలది","మల్లెల వంటి కన్నులు గలది"],1,""],[26,0,"ద్వారబంధమునకు దలుపులు గడియలు / వలెనె నోటికొప్పుగల నియతులు / ధర్మమెఱిఁగి పలుక ధన్యుడౌ భువిలోన / విశ్వదాభిరామ వినురవేమ! — లోకంలో దీన్ని గ్రహించి మాట్లాడితే ధన్యుడవుతాడు","",["ధర్మము","నియమం","భాష","వినయం"],1,""],[27,0,"పందు వలనఁ బుట్టెఁ బరగ ప్రపంచము / పందు వలనఁ బుట్టె పరము నిహము / పందు మేలెఱింగె బ్రహ్మాదులిలలోన / విశ్వదాభిరామ వినురవేమ! — పద్యం ఆధారంగా ఫలము మేలెఱిగిన వారు","",["హరి","హరుడు","బ్రహ్మ","ప్రహ్లాదుడు"],4,""],[28,0,"తలనుండు విషము ఫణికిని / వెలయంగా దోకనుండు వృశ్చికమునకున్ / తలతోక యనక యుండును / ఖలునకు నిలువెల్ల విషము గదరా సుమతీ! — తలలో విషము కలిగినది","",["తుమ్మెద","బల్లి","వృశ్చికము","ఫణి"],4,""],[29,0,"చేతులకు తొడవు దానము / భూతల నాథులకు తొడవు బొంకమి ధరలో / నీతియు తొడవెవ్వారికి / నాతికి మానంబు తొడవు నయముగ సుమతీ! — పై పద్యం ఆధారంగా ధరలో పాలకులకు అలంకారము","",["ప్రజలను కాపాడుట","భూషణములు ధరించుట","అబద్ధము లాడకుండుట","ధర్మాన్ని నిర్ణించుట"],3,""],[30,0,"తములము వేయని నోరును / విమతులతో జెలిమి సేసి వెతబడు తెలివిన్ / గమలములు లేని కొలకును / హిమధాముడు లేని రాత్రి హీనము సుమతీ! — పై పద్యంలో హిమధాముడు అంటే","",["హిమవంతుడు","కైలాసం","చంద్రుడు","మంచుకొండ"],3,""],[31,0,"మండలపతి సముఖంబున / మెండైన ప్రధాని లేక మెలగుట యెల్లన్ / గొండంత మదపుటేనుగు / తొండము లేకుండినట్లు తోచుర సుమతీ! — పై పద్యంలో పేర్కొన్న జంతువు","",["గజం","హరిణం","నక్క","సింహం"],1,""],[32,0,"బంగారు కుదువ బెట్టకు / సంగరమున బాఱిపోకు సరసుడవగుచో / నంగడి వెచ్చము లాడకు / వెంగలితో జెలిమి వలదు వినురా సుమతీ! — కవి వీరితో స్నేహం పనికి రాదన్నాడు","",["మూఢుడు","బంధువు","హాసుడు","విదూషకుడు"],1,""],[33,0,"సద్గోష్ఠి సిరియు నొసగును / సద్గోష్ఠియె కీర్తి బెంచు సంతుష్టిని నా / సద్గోష్ఠియె యొనర గూర్చును / సద్గోష్ఠియె పాపములను జంపు కుమారా! — పై పద్యం ఆధారంగా సజ్జన సాంగత్యం దీనిని వృద్ధి చేస్తుంది","",["ధనం","పుణ్యం","యశస్సు","జ్ఞానం"],3,""],[34,0,"శ్రీభామినీ మనోహరు / సౌభాగ్యదయాస్వభావు సారసనాభున్ / లో భావించెద; నీకున్ / వైభవము లొసంగుచుండ వసుధ కుమారా! — పై పద్యంలో సంబోధన పదం","",["దయా స్వభావుడా","సారసనాభుడు","కుమారా","శ్రీభామినీ"],3,""],[35,0,"ధనపతి సఖుడై యుండియు / నెనయంగా శివుడు భిక్షమెత్తఁగ వలసెన్ / దనవారి కెంతకలిగిన / దనభాగ్యమె తనకుగాక తథ్యము సుమతీ! — పై పద్యంలో మకుటం","",["ధనపతి","శివుడు","సుమతీ","తథ్యము"],3,""],[36,0,"ఎండవెనుకె వాన నిండు హర్షము నిచ్చు / రేయి వెనుకె పగలు హాయినిచ్చు / బాధ వెనుకె సుఖము బహుళమై చెలగురా / వాస్తవమ్ము నాల్గవారి మాట — పై పద్యం ఆధారంగా కష్టం వెనుక వచ్చేది","",["సుకృతి","రేయి","సుఖం","సఖి"],3,""],[37,0,"యోగులందెన్న వేమన యోగి యోగి / శిష్యులందెన్న సిద్ధప్ప సిద్ధమూర్తి / గురువులందెన్న శ్రీవీరగురుడు గురుడు / మతములందెన్న వేదాంత మతమె మతము — పై పద్యం ఆధారంగా శిష్యులందు చెప్పదగిన వారు","",["వీరుడు","గురువు","సిద్ధప్ప","వేమన"],3,""],[38,0,"బహుళ కావ్యములను పరికింపగా వచ్చు / బహుళ శబ్దచయము బలుకవచ్చు / సహనమొక్కటబ్బ చాల కష్టంబురా / విశ్వదాభిరామ వినురవేమ! — 'బహుళ కావ్యములు పరికింపవచ్చు' అనగా భావం","",["కొన్ని కావ్యాలు చదువవచ్చు","అనేక కావ్యాలు చదువవచ్చు","కావ్యాలు చదువలేము","కొన్నికావ్యాలు రాయవచ్చు"],2,""],[39,0,"చిక్కియున్న వేళ సింహంబునైనను / బక్కకుక్క కఱచి బాధ చేయు / బలిమి లేని వేళ బంతంబు చెల్లదు / విశ్వదాభిరామ వినురవేమ — బలము లేనప్పుడు ఇది చెల్లదు","",["పంతం","పనితనం","అభిమతం","విలువ"],1,""],[40,0,"వఱదైన చేను దున్నకు / కరువైనను బంధుజనుల కడకేఁగకుమీ / పరులకు మర్మము సెప్పకు / పిఱికికి దళవాయితనము బెట్టకు సుమతీ! — పై పద్యం ఆధారంగా రహస్యాన్ని వీరికి చెప్పకూడదు","",["స్నేహితులు","పరులు","సోదరులు","పిరికివారికి"],2,""],[41,0,"తాను భుజింపని యర్థము / మానవపతి జేరు గొంత మఱి భూగతమౌ / గానల నీగల గూర్చిన / తేనియ యొరు జేరునట్లు తిరముగ సుమతీ! — తేనెటీగలతో పోల్చినది","",["పరులు","సోదరులు","లోభి","సుతులు"],3,""],[42,0,"కల్లనిజములెల్ల గరకంఠుడెఱుగును / నీరు పల్లమెఱుగు నిజముగాను / దల్లి తానెఱుగును దనయుని జన్మంబు / విశ్వదాభిరామ వినురవేమ! — పై పద్యం ఆధారంగా మన పుట్టుక తెలిసిన వారు","",["వైద్యుడు","జ్యోతిష్కుడు","తల్లి","దైవం"],3,""],[43,1,"అభినవ వాగను శాసనులు శ్రీ గిడుగు రామమూర్తి భాషా సంస్కరణకు పూనుకొని రచనల్లో వ్యావహారికభాషను ప్రయోగించవచ్చనటంతో ఆధునిక కవిత్వం పెద్దమలుపు తిరిగింది. ప్రజలు మాట్లాడే భాషకు, కావ్యాల్లో భాషకు ఉన్న వ్యత్యాసాన్ని తొలగించి కావ్యభాషను ప్రజలకు దగ్గరగా తీసుకు రావాలని జీవితమంతా కృషి చేశారు. — రచనల్లో వ్యావహారిక భాష ప్రయోగించవచ్చనటంతో వచ్చిన మార్పు","",["ఆధునిక కవిత్వం తిరోగమించటం","ఆధునిక కవిత్వం మలుపు తిరగటం","ప్రాచీన కవిత్వం మలుపు తిరగటం","ప్రాచీన కవిత్వం విమర్శించటం"],2,""],[44,1,"రాయప్రోలు సుబ్బారావు గారు బాల్యంలో వారి మేనమామ అవ్వారి సుబ్రహ్మణ్య శాస్త్రి గారితో కలిసి అవధానాలు చేస్తుండేవారు. అవధాన విద్య అపరిమితమైన ఆదరం పొందుతూ ఉన్న కాలంలో రాయప్రోలు అవధాన విద్య వైపు ఆకర్షితులయ్యారు. — రాయప్రోలు వారు వీరితో కలిసి అవధానం చేస్తుండేవారు","",["తాతయ్య","మేనమామ","బాబాయి","పెదనాన్న"],2,""],[45,1,"ఆంధ్రసాహిత్యాన్ని మూడుపువ్వులు ఆరుకాయలుగా వృద్ధిపొందించిన మాస పత్రిక భారతి 1924 లో ప్రారంభింపబడి ఇప్పటికీ క్రమం తప్పకుండా వెలువడటం ఆంధ్రజాతికి గర్వకారణం. స్త్రీల కోసం ప్రారంభించబడినా ఆంధ్రులందరికి ఆదర్శపాత్రమైన గృహలక్ష్మి పత్రిక సాహిత్యానికి చెప్పుకోదగిన సేవ చేసింది. — గద్యమాధారంగా ఆంధ్రజాతికి గర్వకారణమైన పత్రిక","",["శారద","భారతి","ప్రతిభ","జ్వాల"],2,""],[46,1,"శ్రీయుతులు బలిజేపల్లి లక్ష్మీకాంతం, దామరాజు పుండరీకాక్షుడు, మాధవపెద్ది బుచ్చి సుందరరామశాస్త్రి, తుమ్మలసీతారామమూర్తి, దువ్వూరి రామిరెడ్డి ప్రభృతులు జాతీయోద్యమ కవులుగా ప్రఖ్యాతి పొందారు. దామరాజు వారి నాటకాన్ని బ్రిటీష్ ప్రభుత్వం నిషేధించింది. — పై పేరా ఆధారంగా జాతీయోద్యమ కవులుగా ప్రఖ్యాతి పొందనివారు","",["దువ్వూరి రామిరెడ్డి","మాధవ పెద్ది బుచ్చి సుందర రామశాస్త్రి","తుమ్మల సీతారామ మూర్తి","శెట్టి లక్ష్మీనరసింహం"],4,""],[47,1,"ఆధునికాంధ్ర కవితావికాసంలో జాతీయోద్యమం కవిత్వాన్ని సామాన్యులకు దగ్గరగా తెచ్చింది. మిగిలిన సమయాల్లో కవిత్వం రచించని కొందరు దేశ భక్తులను స్వాతంత్ర్యోద్యమం కవులను చేసింది. శ్రీ గురజాడ రాఘవ శర్మ సంపాదకత్వం వహించిన జాతీయ గీతాలు చదివితే ఆనాటి ఉద్యమ, కవితా స్వరూపం చక్కగా బోధపడుతుంది. — జాతీయోద్యమం కవిత్వాన్ని వీరికి దగ్గరగా తెచ్చింది","",["దేశభక్తులకు","ప్రతిభావంతులకు","సామాన్యులకు","సాహిత్యాభిమానులకు"],3,""],[48,1,"తెలంగాణలో సాంస్కృతిక చైతన్యానికి దోహదం చేసిన మాడపాటి హనుమంతరావు, ఆదిరాజు వీరభద్రరావు, సురవరం ప్రతాపరెడ్డిగారలు విద్యావిషయకంగా వెనుకబడివున్న ప్రాంతంలో కవులను ప్రోత్సహించారు. గోలకొండ కవుల రచనలను, ఆకారాలను సేకరించి ప్రకటించిన సురవరం ప్రతాపరెడ్డిగారు యువకులకు గురుతుల్యులు. — పై పేరా ఆధారంగా యువకులకు గురుతుల్యులు","",["మాడపాటి హనుమంతరావు","ఆదిరాజు వీరభద్ర రావు","సురవరం ప్రతాపరెడ్డి","కొమఱ్ఱాజు లక్ష్మణరావు"],3,""],[49,1,"పింగళి – కాటూరి కవులు పరిణతదశలో రాసిన మహాకావ్యం సౌందరనందము. దీనినే ప్రేమోపనిషత్తని మెచ్చారు శ్రీ ఉన్నవ లక్ష్మీనారాయణ. అశ్వఘోషుని సౌందరనందాన్ని రేఖామాత్రంగా గ్రహించి ప్రాచీన కవిత్వంలోని వర్ణనాపటిష్ఠతను, ఆధునిక భావచిత్రాలలోని సౌందర్యాన్ని స్వీకరించి యీ కావ్యం రచించారు. శాంతం, శృంగారం, కరుణ రసాలు ఇందులో చక్కగా నిర్వహించబడ్డాయి. — ఉన్నవ లక్ష్మీనారాయణ 'సౌందరనందము'ను ఇలా మెచ్చుకున్నారు","",["ప్రణయోపనిషత్తు","ప్రేమోపనిషత్తు","పరిణయోపనిషత్తు","ప్రథమోపనిషత్తు"],2,""],[50,1,"భావకవిత్వమనగా సౌందర్యం, ప్రేమ, ముఖ్యంగా విశ్వమానవ ప్రేమ తలపుకొస్తాయి. భావకవిత్వంలో ప్రకృతి, ప్రణయం, ప్రబోధం ప్రాధాన్యం వహిస్తాయి. ఆత్మాశ్రయ రీతి భావకవిత్వంలో ప్రాధాన్యం వహించింది. భావం లేని కవిత్వముంటుందా? అని ప్రశ్నించి భావకవిత్వమన్న పేరును కొందరు కవులు ఆక్షేపించారు. — పై గద్యం ఆధారంగా భావకవిత్వం ప్రాధాన్యం వహించనిది","",["ప్రకృతి","ప్రణయం","విప్లవం","ప్రబోధం"],3,""],[51,1,"చిన్న పిల్లలకు వెన్నెల అంటే ఎంతో ఇష్టం. శ్రీరామచంద్రుని అంతటి వాడే బాల్యంలో చందమామ కావాలని పోరు పెట్టేవాడంటే చంద్రబింబం ఎంత ఆకర్షణీయమో తెలుస్తుంది. అటువంటి చందమామ వెలుగైన – వెన్నెలను మన కవులు కావ్యాల్లో ఎంతో అద్భుతంగా వర్ణించారు. — పై పేరా ఆధారంగా ఆకర్షణీయంగా ఉన్నది","",["ఇష్టం","చంద్రబింబం","కావ్యం","వెన్నెల"],2,""],[52,1,"పాలకడలి గర్భంలో నుండి పుట్టిన వెన్నెల ఉప్పెనలా విజృంభించి దిక్కులన్నీ ముంచెత్తింది. చంద్రబింబం ఆదిశేషుని పానుపులాగా కన్పిస్తూ ఉంది. అందులోని మచ్చ విష్ణువులాగా కన్నులకు కన్పిస్తూ అలరిస్తున్నది. ఇందులోని భావనాకృతి దాని విస్తృతి ఎంత గొప్పగా ఉంది. — పై పేరా ఆధారంగా పాల సముద్రంలో పుట్టి అంతటా వ్యాపించింది","",["చీకటి","నీరు","వెన్నెల","ఉప్పు"],3,""],[53,1,"పరవస్తు చిన్నయసూరి తమిళనాడులోని చెంగల్ పట్టు జిల్లాలోని శ్రీ పెరంబుదూరులో జన్మించాడు. మద్రాసులోని పచ్చయ్యప్ప కళాశాలలో తెలుగు పండితుడిగా పనిచేశాడు. 'సూరి' అనేది ఈయన బిరుదు. సూరి అంటే పండితుడు అని అర్థం. తెలుగు, తమిళ, సంస్కృత, ఆంగ్ల భాషలలో వీరు పండితులు. — శ్రీ పెరంబుదూరు ఇక్కడ ఉంది","",["మద్రాసు జిల్లా","మధురై జిల్లా","చెంగల్ పట్టు జిల్లా","కోయంబత్తూరు జిల్లా"],3,""],[54,1,"సంస్కృతంలో విష్ణుశర్మ పంచతంత్రం విశ్వవిఖ్యాతి గాంచిన గ్రంథం. దాన్ని అనుసరించి అనేక గ్రంథాలు వచ్చాయి. వాటిలో లక్ష్మీనారాయణ పండితుడి హితోపదేశం ఒకటి. దీని ఆధారంగా చిన్నయ సూరి నీతి చంద్రికను తెలుగులో రచించాడు. ఇది గ్రాంథిక వచనంలో సాగుతుంది. — పై పేరా ఆధారంగా చిన్నయసూరి నీతి చంద్రికకు ఆధారం","",["పంచతంత్రం","హితోపదేశం","బుభగీత","గిరికుమారుని ప్రేమగీతాలు"],2,""],[55,1,"చిన్నయసూరి అక్షరగుచ్ఛము, ఆంధ్రకాదంబరి, పద్యాంధ్ర వ్యాకరణము, సూత్రాంధ్రవ్యాకరణము, శబ్దలక్షణ సంగ్రహము, బాలవ్యాకరణము, నీతిచంద్రిక మొదలైన గ్రంథాలు రాశాడు. ఈయన రచనాశైలి పాఠకుణ్ణి ఆకట్టుకునేలా ప్రాచీన కావ్యభాషలో ఉంటుంది. నీతిచంద్రిక బాలవ్యాకరణాలు లక్ష్య–లక్షణ గ్రంథాలుగా ప్రసిద్ధిపొందాయి. — క్రింది వానిలో చిన్నయసూరి రచన కానిది","",["సూత్రాంధ్ర వ్యాకరణం","పద్యాంధ్ర వ్యాకరణం","గద్యాంధ్ర వ్యాకరణం","ఆంధ్ర కాదంబరి"],3,""],[56,1,"మానవజీవితంలో నీతి అనేది చాలా ముఖ్యమైన విషయం. ప్రతి మనిషికీ సంపాదన ఎంతముఖ్యమో పరోపకారం కూడా అంతేముఖ్యం లోభం ఉండకూడదు. లోభం వల్ల తనకుగాని, ఇతరులకు గాని ప్రయోజనం ఉండదు. మనం లోభం లేకుండా మిత్రులకు సహాయం చేయాలి. — పై పేరా ఆధారంగా మనిషి జీవితంలో అతిముఖ్యమైనది","",["ధర్మం","సత్యం","నీతి","సేవ"],3,""],[57,1,"శతకపద్యాల్లో మకుటం ప్రధానమైనది. ఈ పద్యాల్లో ప్రతి పద్యం చివర మకుటం ఉంటుంది. ఇవి ముక్తకాలు, అంటే ఏ పద్యానికదే స్వతంత్ర భావంతో ఉంటుంది. మల్లభూపాలీయం, చిత్రశతకం, తరిగొండ నృసింహశతకం, భక్తచింతామణి శతకం, విశ్వనాథేశ్వర శతకం మొదలైనవి తెలుగు సాహిత్యంలో కోకొల్లలుగా ఉన్నాయి. — శతకపద్యాలు","",["ముక్తియాలు","ముక్తకాలు","ముక్తజాలు","ముక్తవాలు"],2,""],[58,1,"శ్రీకాళహస్తీశ్వర అనే మకుటంతో ఉన్న పద్యం ధూర్జటి కవి రచించిన శ్రీకాళహస్తీశ్వర శతకంలోనిది. వీరు పదహారవ శతాబ్దికి చెందిన కవి. శ్రీ కృష్ణదేవరాయల ఆస్థానంలో అష్టదిగ్గజ కవులలో ఒకడిగా ఉండి అనేక సత్కారాలు పొందాడు. కాళహస్తి మాహాత్మ్యమును ప్రబంధశైలిలో రచించాడు. రాజులను, రాజసేవను నిరసించాడు. — శ్రీకాళహస్తీశ్వర శతకంలోని మకుటం","",["శ్రీకాళ హస్తేశ్వర","శ్రీకాళహస్తీశ్వరా","శ్రీకాళహస్త్రీశ్వరా","శ్రీకాళుకేశ్వరా"],2,""],[59,1,"తరిగొండ వెంగమాంబ 18వ శతాబ్దికి చెందిన కవయిత్రి. చిత్తూరు జిల్లా తరిగొండ గ్రామనివాసి. బాల్యం నుంచే భగవద్భక్తురాలు. వీరు నృసింహ శతకంతో పాటు శివనాటకం, నారసింహవిలాసకథ అనే యక్షగానాలు, రాజయోగామృతం అనే ద్విపద కావ్యం, శ్రీ వేంకటాచల మాహాత్మ్యం, అష్టాంగ యోగసారం, వాశిష్ఠ రామాయణమనే పద్యకావ్యాలు రచించారు. — వెంగమాంబ యక్షగానం","",["రాజయోగామృతం","రామాయణం","శివనాటకం","వాశిష్ఠ రామాయణం"],3,""],[60,1,"తామరపువ్వు కాండముతో మదపుటేనుగును బంధించాలని ఆలోచించేవాడు, దిరిసెనపువ్వు కొనతో వజ్రమును కోయుటకు ప్రయత్నించేవాడు, ఒక్క తేనె బొట్టుతో ఉప్పుసముద్రపు నీటిని తియ్యగా మార్చాలనుకునేవాడితోను, మూర్ఖులను మంచి మాటలతో మార్చాలని ప్రయత్నించే వారు కూడా మూర్ఖులతో సమానులవుతారు. — గద్యమాధారంగా మూర్ఖుని మంచి మాటలతో మార్చాలనుకునే వాడు","",["జ్ఞాని","బుద్ధిమంతుడు","మహాత్ముడు","మూర్ఖుడు"],4,""],[61,1,"నేటి విద్యా విధానంలోనూ తెలుగు వాచకంలో ఎన్నోకొన్ని వేమన పద్యాలు కన్పిస్తూనే ఉన్నాయి. చెప్పే సామర్థ్యమున్న తాతల తరం వారి వార్ధక్యశిబిరాలకు పరిమితమైపోయి తమ మనవళ్ళకూ, మనవరాళ్ళకూ బోధించే అవకాశం లేని దుస్థితిలో కూడా నేటి బాలలు వేమన పద్యాలు కంఠస్థం చేయగలుగుతున్నారు. సరైన అర్థం తెలియకపోయినా వేమన పద్యాలు మననం చేస్తున్నారు. — పై పేరా ఆధారంగా వీరి పద్యాలు ఎన్నోకొన్ని తెలుగువాచకంలో కనిపిస్తున్నాయి","",["బద్దెన","వేమన","పోతన","మారదవెంకయ్య"],2,""],[62,1,"1829 తంజావూరిలోని రామారావు ఐరవయ్యోనిమిదేళ్ళవాడు. బహుయోగ్యుడు. నిండా మర్యాదస్థుడు. మరాఠీ వ్యాకరణాన్ని రచించాడు. 'తెలిమఖన్' ను మరాఠీలోకి అనువదించాడు. ఇతని ఇంగ్లీషు భాషా జ్ఞానం ఆశ్చర్యకరమైనది. కాలేజీలో హెడ్మాస్టరు పనికి నిండా అర్హతలున్నవాడు. — రామారావు రచించిన వ్యాకరణం","",["ఇంగ్లీషు వ్యాకరణం","మరాఠీ వ్యాకరణం","సంస్కృత వ్యాకరణం","తెలుగు వ్యాకరణం"],2,""],[63,1,"పద్యాన్ని గుండెలు చీల్చుకొని పోయేలాగా రచించిన భావకవి శ్రీనాయని సుబ్బారావు. సౌభద్రుని ప్రణయ యాత్ర, ఫలశ్రుతి, మాతృగీతాలు భావకవితాశాఖకు చెందినవి. స్వాతంత్ర్యానంతరం ఆయన రచించిన కావ్యాల్లో 'వేదనా వాసుదేవము', జన్మభూమి సంప్రదాయ పద్ధతిలోనివి. జీవితానుభవాలు గానం చేశాక శ్రీ నాయని అంతర్ముఖులై రచించిన కావ్యం వేదనా వాసుదేవము. జన్మభూమిమోహపటిమ చేత తాను జన్మించిన పొదిలె సీమ మహిమలను, అందచందాలను, ఆ సీమతో తనకున్న వీడరాని బంధాన్ని \"జన్మభూమి\"లో వర్ణించారు. — నాయని సుబ్బారావు స్వాతంత్ర్యానంతర రచన","",["మాతృగీతాలు","వేదనావాసుదేవము","సౌభద్రుని ప్రణయయాత్ర","ఫలశ్రుతి"],2,""],[64,1,"అభినవ వాగను శాసనులు శ్రీ గిడుగు రామమూర్తి భాషా సంస్కరణకు పూనుకొని రచనల్లో వ్యావహారికభాషను ప్రయోగించవచ్చనటంతో ఆధునిక కవిత్వం పెద్దమలుపు తిరిగింది. ప్రజలు మాట్లాడే భాషకు, కావ్యాల్లో భాషకు ఉన్న వ్యత్యాసాన్ని తొలగించి కావ్యభాషను ప్రజలకు దగ్గరగా తీసుకు రావాలని జీవితమంతా కృషి చేశారు. — పై పేరాలో గిడుగు వారిని ఇలా సంబోధించారు","",["అభినవ శాసనుడు","అభినవ వాగీశుడు","అభినవ వాగనుశాసనుడు","అభినవ విశ్వేశ్వరుడు"],3,""],[65,1,"రాయప్రోలు సుబ్బారావు గారు బాల్యంలో వారి మేనమామ అవ్వారి సుబ్రహ్మణ్య శాస్త్రి గారితో కలిసి అవధానాలు చేస్తుండేవారు. అవధాన విద్య అపరిమితమైన ఆదరం పొందుతూ ఉన్న కాలంలో రాయప్రోలు అవధాన విద్య వైపు ఆకర్షితులయ్యారు. — ఈ విద్యవైపు రాయప్రోలువారు ఆకర్షితులయ్యారు","",["విలువల విద్య","సాహిత్య విద్య","సాంస్కృతిక విద్య","అవధాన విద్య"],4,""],[66,1,"ఆంధ్రసాహిత్యాన్ని మూడుపువ్వులు ఆరుకాయలుగా వృద్ధిపొందించిన మాస పత్రిక భారతి 1924 లో ప్రారంభింపబడి ఇప్పటికీ క్రమం తప్పకుండా వెలువడటం ఆంధ్రజాతికి గర్వకారణం. స్త్రీల కోసం ప్రారంభించబడినా ఆంధ్రులందరికి ఆదర్శపాత్రమైన గృహలక్ష్మి పత్రిక సాహిత్యానికి చెప్పుకోదగిన సేవ చేసింది. — పై పేరా ఆధారంగా గృహలక్ష్మి పత్రిక వీరి కోసం ప్రారంభించబడింది","",["బాలలు","వృద్ధులు","స్త్రీలు","వయోజనులు"],3,""],[67,1,"శ్రీయుతులు బలిజేపల్లి లక్ష్మీకాంతం, దామరాజు పుండరీకాక్షుడు, మాధవపెద్ది బుచ్చి సుందరరామశాస్త్రి, తుమ్మలసీతారామమూర్తి, దువ్వూరి రామిరెడ్డి ప్రభృతులు జాతీయోద్యమ కవులుగా ప్రఖ్యాతి పొందారు. దామరాజు వారి నాటకాన్ని బ్రిటీష్ ప్రభుత్వం నిషేధించింది. — పై పేరా ఆధారంగా బ్రిటీష్ ప్రభుత్వం వీరినాటకాన్ని నిషేధించింది","",["బలిజేపల్లి లక్ష్మీకాంతం","దామరాజు పుండరీకాక్షుడు","తుమ్మల సీతారామ మూర్తి","దువ్వూరి రామిరెడ్డి"],2,""],[68,1,"ఆధునికాంధ్ర కవితావికాసంలో జాతీయోద్యమం కవిత్వాన్ని సామాన్యులకు దగ్గరగా తెచ్చింది. మిగిలిన సమయాల్లో కవిత్వం రచించని కొందరు దేశ భక్తులను స్వాతంత్ర్యోద్యమం కవులను చేసింది. శ్రీ గురజాడ రాఘవ శర్మ సంపాదకత్వం వహించిన జాతీయ గీతాలు చదివితే ఆనాటి ఉద్యమ, కవితా స్వరూపం చక్కగా బోధపడుతుంది. — శ్రీ గురజాడ రాఘవ శర్మ గారు దీనికి సంపాదకత్వం వహించారు","",["జాతీయ గేయాలు","జాతీయ గీతాలు","జాతీయ గీర్వాణి","జాతీయ గైర్వాణి"],2,""],[69,1,"తెలంగాణలో సాంస్కృతిక చైతన్యానికి దోహదం చేసిన మాడపాటి హనుమంతరావు, ఆదిరాజు వీరభద్రరావు, సురవరం ప్రతాపరెడ్డిగారలు విద్యావిషయకంగా వెనుకబడివున్న ప్రాంతంలో కవులను ప్రోత్సహించారు. గోలకొండ కవుల రచనలను, ఆకారాలను సేకరించి ప్రకటించిన సురవరం ప్రతాపరెడ్డిగారు యువకులకు గురుతుల్యులు. — పై పేరా ఆధారంగా మాడపాటి హనుమంతరావు, సురవరం ప్రతాపరెడ్డి వంటి వారు ఈ విషయంలో వెనుకబడి ఉన్న ప్రాంత కవులను ప్రోత్సహించారు","",["విద్యా విషయం","వ్యవసాయ విషయం","కళల విషయం","ఆధునికత విషయం"],1,""],[70,1,"పింగళి – కాటూరి కవులు పరిణతదశలో రాసిన మహాకావ్యం సౌందరనందము. దీనినే ప్రేమోపనిషత్తని మెచ్చారు శ్రీ ఉన్నవ లక్ష్మీనారాయణ. అశ్వఘోషుని సౌందరనందాన్ని రేఖామాత్రంగా గ్రహించి ప్రాచీన కవిత్వంలోని వర్ణనాపటిష్ఠతను, ఆధునిక భావచిత్రాలలోని సౌందర్యాన్ని స్వీకరించి యీ కావ్యం రచించారు. శాంతం, శృంగారం, కరుణ రసాలు ఇందులో చక్కగా నిర్వహించబడ్డాయి. — సౌందరనందము లో నిర్వహించబడని రసము","",["శాంతం","శృంగారం","హాస్యము","కరుణ"],3,""],[71,1,"భావకవిత్వమనగా సౌందర్యం, ప్రేమ, ముఖ్యంగా విశ్వమానవ ప్రేమ తలపుకొస్తాయి. భావకవిత్వంలో ప్రకృతి, ప్రణయం, ప్రబోధం ప్రాధాన్యం వహిస్తాయి. ఆత్మాశ్రయ రీతి భావకవిత్వంలో ప్రాధాన్యం వహించింది. భావం లేని కవిత్వముంటుందా? అని ప్రశ్నించి భావకవిత్వమన్న పేరును కొందరు కవులు ఆక్షేపించారు. — ఈ రీతికి భావ కవిత్వం ప్రాధాన్యం వహించింది","",["ఆత్మాశ్రయ","ఆత్మానంద","ఆవేశాత్మక","ఆనందాశ్రయ"],1,""],[72,1,"చిన్న పిల్లలకు వెన్నెల అంటే ఎంతో ఇష్టం. శ్రీరామచంద్రుని అంతటి వాడే బాల్యంలో చందమామ కావాలని పోరు పెట్టేవాడంటే చంద్రబింబం ఎంత ఆకర్షణీయమో తెలుస్తుంది. అటువంటి చందమామ వెలుగైన – వెన్నెలను మన కవులు కావ్యాల్లో ఎంతో అద్భుతంగా వర్ణించారు. — పై పేరా ఆధారంగా వీరికి వెన్నెలంటే అత్యంత మక్కువ","",["పెద్దవారు","కౌమారులు","చిన్నపిల్లలు","జ్ఞానులు"],3,""],[73,1,"పాలకడలి గర్భంలో నుండి పుట్టిన వెన్నెల ఉప్పెనలా విజృంభించి దిక్కులన్నీ ముంచెత్తింది. చంద్రబింబం ఆదిశేషుని పానుపులాగా కన్పిస్తూ ఉంది. అందులోని మచ్చ విష్ణువులాగా కన్నులకు కన్పిస్తూ అలరిస్తున్నది. ఇందులోని భావనాకృతి దాని విస్తృతి ఎంత గొప్పగా ఉంది. — పై పేరా ఆధారంగా ఆదిశేషుని పాన్పులాగా కనిపించేది","",["జ్యోత్స్న","రజని","చంద్రుడు","సముద్రం"],3,""],[74,1,"పరవస్తు చిన్నయసూరి తమిళనాడులోని చెంగల్ పట్టు జిల్లాలోని శ్రీ పెరంబుదూరులో జన్మించాడు. మద్రాసులోని పచ్చయ్యప్ప కళాశాలలో తెలుగు పండితుడిగా పనిచేశాడు. 'సూరి' అనేది ఈయన బిరుదు. సూరి అంటే పండితుడు అని అర్థం. తెలుగు, తమిళ, సంస్కృత, ఆంగ్ల భాషలలో వీరు పండితులు. — \"సూరి\" అంటే","",["పామరుడు","పవనుడు","పావనుడు","పండితుడు"],4,""],[75,1,"సంస్కృతంలో విష్ణుశర్మ పంచతంత్రం విశ్వవిఖ్యాతి గాంచిన గ్రంథం. దాన్ని అనుసరించి అనేక గ్రంథాలు వచ్చాయి. వాటిలో లక్ష్మీనారాయణ పండితుడి హితోపదేశం ఒకటి. దీని ఆధారంగా చిన్నయ సూరి నీతి చంద్రికను తెలుగులో రచించాడు. ఇది గ్రాంథిక వచనంలో సాగుతుంది. — పై పేరా ఆధారంగా విశ్వవిఖ్యాతి గాంచిన గ్రంథం","",["పంచాయతనం","పంచతాంత్రికం","పంచతంత్రం","పంచ ప్రాంతం"],3,""],[76,1,"చిన్నయసూరి అక్షరగుచ్ఛము, ఆంధ్రకాదంబరి, పద్యాంధ్ర వ్యాకరణము, సూత్రాంధ్రవ్యాకరణము, శబ్దలక్షణ సంగ్రహము, బాలవ్యాకరణము, నీతిచంద్రిక మొదలైన గ్రంథాలు రాశాడు. ఈయన రచనాశైలి పాఠకుణ్ణి ఆకట్టుకునేలా ప్రాచీన కావ్యభాషలో ఉంటుంది. నీతిచంద్రిక బాలవ్యాకరణాలు లక్ష్య–లక్షణ గ్రంథాలుగా ప్రసిద్ధిపొందాయి. — చిన్నయసూరి రచనా శైలి","",["ప్రాచీన కావ్యభాష","నవీన కావ్యభాష","ప్రాచీన చంపూభాష","నవీన పద్యభాష"],1,""],[77,1,"మానవజీవితంలో నీతి అనేది చాలా ముఖ్యమైన విషయం. ప్రతి మనిషికీ సంపాదన ఎంతముఖ్యమో పరోపకారం కూడా అంతేముఖ్యం లోభం ఉండకూడదు. లోభం వల్ల తనకుగాని, ఇతరులకు గాని ప్రయోజనం ఉండదు. మనం లోభం లేకుండా మిత్రులకు సహాయం చేయాలి. — పై పేరా ఆధారంగా మనలో ఉండకూడదని","",["లోభం","నీతి","సంపాదన","క్రమశిక్షణ"],1,""],[78,1,"శతకపద్యాల్లో మకుటం ప్రధానమైనది. ఈ పద్యాల్లో ప్రతి పద్యం చివర మకుటం ఉంటుంది. ఇవి ముక్తకాలు, అంటే ఏ పద్యానికదే స్వతంత్ర భావంతో ఉంటుంది. మల్లభూపాలీయం, చిత్రశతకం, తరిగొండ నృసింహశతకం, భక్తచింతామణి శతకం, విశ్వనాథేశ్వర శతకం మొదలైనవి తెలుగు సాహిత్యంలో కోకొల్లలుగా ఉన్నాయి. — పై పేరాలో లేని శతకం","",["భక్తచింతామణి","విశ్వనాథేశ్వర","లొంక రామేశ్వర","తరిగొండ నృసింహ"],3,""],[79,1,"శ్రీకాళహస్తీశ్వర అనే మకుటంతో ఉన్న పద్యం ధూర్జటి కవి రచించిన శ్రీకాళహస్తీశ్వర శతకంలోనిది. వీరు పదహారవ శతాబ్దికి చెందిన కవి. శ్రీ కృష్ణదేవరాయల ఆస్థానంలో అష్టదిగ్గజ కవులలో ఒకడిగా ఉండి అనేక సత్కారాలు పొందాడు. కాళహస్తి మాహాత్మ్యమును ప్రబంధశైలిలో రచించాడు. రాజులను, రాజసేవను నిరసించాడు. — శ్రీకృష్ణదేవరాయల ఆస్థానంలో కవులు","",["అష్టదిక్పాలురు","అష్టదిగ్గజాలు","అష్టభైరవులు","అష్టగజాలు"],2,""],[80,1,"తరిగొండ వెంగమాంబ 18వ శతాబ్దికి చెందిన కవయిత్రి. చిత్తూరు జిల్లా తరిగొండ గ్రామనివాసి. బాల్యం నుంచే భగవద్భక్తురాలు. వీరు నృసింహ శతకంతో పాటు శివనాటకం, నారసింహవిలాసకథ అనే యక్షగానాలు, రాజయోగామృతం అనే ద్విపద కావ్యం, శ్రీ వేంకటాచల మాహాత్మ్యం, అష్టాంగ యోగసారం, వాశిష్ఠ రామాయణమనే పద్యకావ్యాలు రచించారు. — వెంగమాంబ ఈ దశ నుంచే భగవద్భక్తురాలు","",["యవ్వన","వార్ధక్య","కౌమార","బాల్య"],4,""],[81,1,"తామరపువ్వు కాండముతో మదపుటేనుగును బంధించాలని ఆలోచించేవాడు, దిరిసెనపువ్వు కొనతో వజ్రమును కోయుటకు ప్రయత్నించేవాడు, ఒక్క తేనె బొట్టుతో ఉప్పుసముద్రపు నీటిని తియ్యగా మార్చాలనుకునేవాడితోను, మూర్ఖులను మంచి మాటలతో మార్చాలని ప్రయత్నించే వారు కూడా మూర్ఖులతో సమానులవుతారు. — పై గద్యం ఆధారంగా దిరిసెన పువ్వు కొనతో కోయలేనిది","",["వజ్రం","అద్దం","చెక్క","కాయ"],1,""],[82,1,"నేటి విద్యా విధానంలోనూ తెలుగు వాచకంలో ఎన్నోకొన్ని వేమన పద్యాలు కన్పిస్తూనే ఉన్నాయి. చెప్పే సామర్థ్యమున్న తాతల తరం వారి వార్ధక్యశిబిరాలకు పరిమితమైపోయి తమ మనవళ్ళకూ, మనవరాళ్ళకూ బోధించే అవకాశం లేని దుస్థితిలో కూడా నేటి బాలలు వేమన పద్యాలు కంఠస్థం చేయగలుగుతున్నారు. సరైన అర్థం తెలియకపోయినా వేమన పద్యాలు మననం చేస్తున్నారు. — వేమనపద్యాలు చెప్పే సామర్థ్యమున్న తాతల తరం ఎక్కడ పరిమితమైంది","",["ధార్మిక శిబిరం","ఆధ్యాత్మిక శిబిరం","వార్ధక్య శిబిరం","దీక్షాశిబిరం"],3,""],[83,1,"1829 తంజావూరిలోని రామారావు ఐరవయ్యోనిమిదేళ్ళవాడు. బహుయోగ్యుడు. నిండా మర్యాదస్థుడు. మరాఠీ వ్యాకరణాన్ని రచించాడు. 'తెలిమఖన్' ను మరాఠీలోకి అనువదించాడు. ఇతని ఇంగ్లీషు భాషా జ్ఞానం ఆశ్చర్యకరమైనది. కాలేజీలో హెడ్మాస్టరు పనికి నిండా అర్హతలున్నవాడు. — 1829 లో రామారావు వయస్సు","",["ఇరవయ్యెనిమిది","ముప్పయి","ఇరవయ్యారు","ముప్పదిరెండు"],1,""],[84,1,"పద్యాన్ని గుండెలు చీల్చుకొని పోయేలాగా రచించిన భావకవి శ్రీనాయని సుబ్బారావు. సౌభద్రుని ప్రణయ యాత్ర, ఫలశ్రుతి, మాతృగీతాలు భావకవితాశాఖకు చెందినవి. స్వాతంత్ర్యానంతరం ఆయన రచించిన కావ్యాల్లో 'వేదనా వాసుదేవము', జన్మభూమి సంప్రదాయ పద్ధతిలోనివి. జీవితానుభవాలు గానం చేశాక శ్రీ నాయని అంతర్ముఖులై రచించిన కావ్యం వేదనా వాసుదేవము. జన్మభూమిమోహపటిమ చేత తాను జన్మించిన పొదిలె సీమ మహిమలను, అందచందాలను, ఆ సీమతో తనకున్న వీడరాని బంధాన్ని \"జన్మభూమి\"లో వర్ణించారు. — నాయని సుబ్బారావు పొదిలె సీమ మహిమలు, అందచందాలు వర్ణించిన రచన","",["జన్మభూమి","ఫలశ్రుతి","వేదనావాసుదేవము","మాతృగీతాలు"],1,""],[85,2,"\"అమ్మఒడి\" గేయం రచయిత","",["బి. వి. నరసింహారావు","సత్యం శంకరమంచి"," nciple of Uniform Pattern","Principle of Proximodistal"],3,"",["వికాసం నిరంతరమైనది","వికాసాన్ని ఊహించవచ్చు","ఏకరూప నమూనా సూత్రం","సమీప దూరస్థ సూత్రం"]],[35,1,"A physically challenged child shows aggressive behaviour in some emotions. This principle of development is","శారీరక వైకల్యం గల పిల్లవాడు కొన్ని ఉద్వేగాల్లో దూకుడుగా ప్రవర్తిస్తాడు. ఈ వికాస సూత్రం",["Development is continuous","Different aspects of development are interrelated","Development is cumulative","Development is predictable"],2,"",["వికాసం నిరంతరమైనది","వికాసంలోని వివిధ అంశాలు పరస్పర సంబంధం కలవి","వికాసం సంచితమైనది","వికాసాన్ని ఊహించవచ్చు"]],[36,1,"We see that an infant uses his shoulders and elbows first to reach an object and then uses his wrists and fingers. This principle of development is","శిశువు వస్తువును అందుకోవడానికి మొదట భుజాలు, మోచేతులు, తర్వాత మణికట్టు, వేళ్ళు ఉపయోగిస్తాడు. ఈ వికాస సూత్రం",["Development is continuous","Development is cumulative","Principle of Cephalocaudal development","Principle of Proximodistal"],4,"",["వికాసం నిరంతరమైనది","వికాసం సంచితమైనది","శిరోపాదాభిముఖ వికాస సూత్రం","సమీప దూరస్థ సూత్రం"]],[37,1,"Growth is rapid during infancy and childhood. Later it becomes slower. In adolescence it is rapid again. This principle of development is","శైశవం, బాల్యంలో పెరుగుదల వేగంగా, తర్వాత నెమ్మదిగా, కౌమారంలో మళ్ళీ వేగంగా ఉంటుంది. ఈ వికాస సూత్రం",["Principle of Predictability","Principle of Non-Uniform Pattern","Principle of Cephalocaudal development","Principle of Cumulative development"],2,"",["ఊహించదగిన సూత్రం","అసమాన నమూనా సూత్రం","శిరోపాదాభిముఖ సూత్రం","సంచిత వికాస సూత్రం"]],[38,1,"A girl who is singing very well in her childhood is appreciated and blessed to become a good singer in future by her teacher. This principle of development is","బాల్యంలో బాగా పాడే బాలికను భవిష్యత్తులో మంచి గాయని అవుతుందని ఉపాధ్యాయుడు ఆశీర్వదించారు. ఈ వికాస సూత్రం",["Development is cumulative","Development is continuous","Development is predictable","Principle of Proximodistal development"],3,"",["వికా he synonym of the word “misery”.","",["pleasure","easy","difficulty","contenment"],3,"misery = దుఃఖం, కష్టం → difficulty. pleasure, contentment = సంతోషం (వ్యతిరేకం)."],[6,0,"The two friends were seldom seen together. Choose the synonym of the word “seldom”.","",["often","rarely","frequently","never"],2,"seldom = అరుదుగా → rarely. often, frequently = తరచుగా (వ్యతిరేకం)."],[7,0,"He brought us nothing but ruin. Choose the synonym of the word “ruin”.","",["reconstruction","preservstion","care","damage"],4,"ruin = నాశనం → damage. reconstruction, preservation = కాపాడటం/తిరిగి కట్టడం (వ్యతిరేకం)."],[8,0,"It was to be a battle of champions. Choose the synonym of the word “battle”.","",["truce","fight","peace","calm"],2,"battle = యుద్ధం → fight. truce, peace = శాంతి (వ్యతిరేకం)."],[9,0,"What a weird sound! Choose the synonym of the word “weird”.","",["normal","ordinary","strange","usual"],3,"weird = వింతైన → strange. normal, ordinary, usual = మామూలు (వ్యతిరేకం)."],[10,0,"So many vendors came to the door. Choose the synonym of the word “vendors”.","",["sellers","buyers","customers","consumers"],1,"vendors = అమ్మేవారు → sellers. buyers, customers = కొనేవారు."],[11,0,"He looked unsure. Choose the synonym of the word “unsure”.","",["unconfident","confident","assertive","sure"],1,"unsure = నిశ్చయం లేని → unconfident. గుర్తు: un- = కాదు."],[12,0,"It is a tribute to some of the bravest soldiers. Choose the synonym of the word “tribute”.","",["criticism","salute","condemnation","price"],2,"tribute = నివాళి, గౌరవం → salute. criticism, condemnation = విమర్శ (వ్యతిరేకం)."],[13,0,"It was a pleasure to receive your letter. Choose the synonym of the word “pleasure”.","",["sorrow","pain","unhappy","delight"],4,"pleasure = ఆనందం → delight. sorrow, pain = బాధ (వ్యతిరేకం)."],[14,0,"In the end I used brute force. Choose the synonym of the word “brute”.","",["still","flat","beast","hunger"],3,"brute = క్రూర జంతువు/పశుబలం → beast."],[15,0,"I shall never forget this moment. Choose the synonym of the word “moment”.","",["short time","lengthy","lasting","permanent"],1,"moment = క్షణం → short time. lasting, permanent = శాశ్వతం (వ్యతిరేకం)."],[16,0,"A time I will treasure as long as I live. Choose the synonym of the word “treasure”","",["calm","cheap","less","preserve"],4,"treasure (క్రియ) = అపురూపంగా దాచుకోవడం → preserve."],[17,0,"She is still traumatised. Choose the synonym of the word “traumatised”.","",["greatly shocked","smiled","explained","examined"],1,"traumatised = తీవ్ర షాక్‌కు గురైన → greatly shocked."],[18,0,"They have been trigged by a massive earthquake. Choose the synonym of the word “massive”.","",["tiny","small","very big","short"],3,"massive = భారీ → very big. tiny, small = చిన్న (వ్యతిరేకం)."],[19,0,"The family took refuge in the third floor. Choose the synonym of the word “refuge”.","",["protection","voluntary","learned","concious"],1,"refuge = ఆశ్రయం → protection."],[20,0,"He lived alone. Choose the synonym of the word “alone”.","",["familiar","solo","in company","possible"],2,"alone = ఒంటరిగా → solo. in company = తోడుగా (వ్యతిరేకం)."],[21,0,"He had an excellent memory. Choose the synonym of the word “excellent”.","",["poor","inferior","very good","bad"],3,"excellent = అద్భుతమైన → very good. poor, inferior, bad = వ్యతిరేకం."],[22,0,"He had lost his appetite. Choose the synonym of the word “appetite”.","",["aversion","hunger","poverty","richness"],2,"appetite = ఆకలి → hunger. aversion = అయిష్టం."],[23,0,"There was no harm in asking him. Choose the synonym of the word “harm”.","",["benefit","harmless","good","pain"],4,"harm = హాని → pain. benefit, good = మేలు (వ్యతిరేకం)."],[24,0,"The entire episode has slipped out of your mind. Choose the synonym of the word “entire”.","",["partial","whole","broken","small"],2,"entire = మొత్తం → whole. partial = పాక్షికం (వ్యతిరేకం)."],[25,1,"What homework do you usually have? Choose the antonym of the word 'usually'.","",["normally","generally","exceptionally","regularly"],3,"usually (సాధారణంగా) ↔ exceptionally (అసాధారణంగా). normally, generally, regularly = పర్యాయపదాలు."],[26,1,"He yelled. Choose the antonym of the word 'yelled'.","",["whispered","cried","screamed","shrieked"],1,"yelled (గట్టిగా అరిచాడు) ↔ whispered (గుసగుసలాడాడు). cried, screamed, shrieked = అరవడమే."],[27,1,"Muttering their anger and disappointment, the villagers left the place one by one. Choose the antonym of the word 'mutter'.","",["speaking unclearly","murmur","mumble","speak out"],4,"muttering (గొణుగుతూ) ↔ speak out (స్పష్టంగా చెప్పడం). murmur, mumble = గొణగడమే."],[28,1,"It takes enormous ability to become an astronaut. Choose the antonym of the word 'enormous'.","",["huge","vast","tiny","extensive"],3,"enormous (అతి పెద్ద) ↔ tiny (అతి చిన్న)."],[29,1,"“Are your helpers kind to you?” I asked. Choose the antonym of the word 'kind'..","",["affectionate","considerate","good-natured","unkind"],4,"kind ↔ unkind. గుర్తు: un- చేర్చితే వ్యతిరేకం."],[30,1,"“Shall I lead you anywhere?” I asked. Choose the antonym of the word 'lead'.","",["guide","follow","show","steer"],2,"lead (నడిపించు) ↔ follow (అనుసరించు)."],[31,1,"Jithin had an old aunt. Choose the antonym of the word 'old'.","",["aged","senior","older","young"],4,"old ↔ young."],[32,1,"Many wise men came to the king. Choose the antonym of the word 'wise'.","",["intelligent","foolish","clever","knowledgeable"],2,"wise (తెలివైన) ↔ foolish (మూర్ఖ)."],[33,1,"He could remember where he was. Choose the antonym of the word 'remember'.","",["forget","recall","recollect","memorize"],1,"remember ↔ forget. recall, recollect = గుర్తు చేసుకోవడమే."],[34,1,"The king was very happy. Choose the antonym of the word 'happy'.","",["cheerful","sad","joyful","merry"],2,"happy ↔ sad. cheerful, joyful, merry = పర్యాయపదాలు."],[35,1,"“Ravi, send that beggar away!” cried his mother. Choose the antonym of the word 'send'","",["dispatch","forward","receive","communicate"],3,"send (పంపు) ↔ receive (స్వీకరించు)."],[36,1,"My legs are so thin and ugly! Choose the antonym of the word 'thin'","",["thick","narrow","lightweight","delicate"],1,"thin (సన్నని) ↔ thick (లావైన)."],[37,1,"Muko would sit on it as Snug as any cat. Choose the antonym of the word 'Snug'","",["comfortable","cosy","warm","bleak"],4,"snug (వెచ్చగా, హాయిగా) ↔ bleak (చల్లని, నిర్జీవమైన)."],[38,1,"The covetous old fellow began to dig. Choose the antonym of the word 'covetous'.","",["greedy","satisfied","rapacious","jealous"],2,"covetous (అత్యాశగల) ↔ satisfied (తృప్తిగల). greedy, rapacious = పర్యాయపదాలు."],[39,1,"The next day the stingy neighbour came. Choose the antonym of the word 'stingy'.","",["miserly","mean","generous","parsimonious"],3,"stingy (పిసినారి) ↔ generous (ఉదారమైన). miserly, mean = పర్యాయపదాలు."],[40,1,"Our valiant soldiers have made great sacrifices for us. Choose the antonym of the word 'valiant'.","",["very brave","cowardly","firm","bold"],2,"valiant (ధైర్యవంతమైన) ↔ cowardly (పిరికి)."],[41,1,"I haven't been brave. Choose the antonym of the word 'brave'.","",["valiant","cowardly","valorous","heroic"],2,"brave ↔ cowardly. valiant, heroic = పర్యాయపదాలు."],[42,1,"Suddenly I felt weak all over. Choose the antonym of the word 'suddenly'.","",["instantly","promptly","gradually","abruptly"],3,"suddenly (అకస్మాత్తుగా) ↔ gradually (క్రమంగా)."],[43,1,"I had wanted one, but they were far too expensive. Choose the antonym of the word 'expensive'.","",["costly","overpriced","exorbitant","cheap"],4,"expensive (ఖరీదైన) ↔ cheap (చౌక)."],[44,1,"A tsunami is very large and powerful wave. Choose the antonym of the word 'large'","",["big","small","great","huge"],2,"large ↔ small."],[45,1,"We accept you as rulers. Choose the antonym of the word 'accept'.","",["receive","reject","take","get"],2,"accept ↔ reject."],[46,1,"All the misery in the world is due to human desires. Choose the antonym of the word 'misery'.","",["unhappiness","distress","anguish","contentment"],4,"misery (దుఃఖం) ↔ contentment (తృప్తి)."],[47,1,"I have more personal answer to the question. Choose the antonym of the word 'personal'.","",["public","unique","individual","private"],1,"personal (వ్యక్తిగత) ↔ public (బహిరంగ)."],[48,1,"Knowledge should be practical and scientific. Choose the antonym of the word 'practical'","",["hands-on","real","actual","theoretical"],4,"practical (ఆచరణాత్మక) ↔ theoretical (సైద్ధాంతిక)."],[49,2,"Choose the correctly spelt word.","",["misery","misary","micery","micary"],1,"Spelling: misery (m-i-s-e-r-y)."],[50,2,"Choose the correctly spelt word.","",["favarate","favorate","favarate","favourite"],4,"Spelling: favourite (British). గుర్తు: favour + ite."],[51,2,"Choose the correctly spelt word.","",["respancible","responcible","responsible","respansable"],3,"Spelling: responsible → -sible తో ముగుస్తుంది."],[52,2,"Choose the correctly spelt word.","",["deliciose","delicious","dalicious","dilecious"],2,"Spelling: delicious → -cious."],[53,2,"Choose the correctly spelt word","",["kichen","kitchen","ketchin","kitchan"],2,"Spelling: kitchen → 't' తో \"kit-chen\"."],[54,2,"Choose the correctly spelt word.","",["cliff","cliph","clif","clife"],1,"Spelling: cliff → చివర ff."],[55,2,"Choose the correctly spelt word","",["shrieked","shreiked","shreeked","shreked"],1,"Spelling: shrieked → \"i before e\" (shriek)."],[56,2,"Choose the correctly spelt word.","",["atitude","attitude","attetude","atitud"],2,"Spelling: attitude → రెండు 't'లు (at-ti-tude)."],[57,2,"Choose the correctly spelt word.","",["cowncil","counsil","council","cownsil"],3,"Spelling: council (మండలి). counsel = సలహా – రెండూ వేరు."],[58,2,"Choose the correctly spelt word.","",["squerral","squerrel","squirel","squirrel"],4,"Spelling: squirrel → రెండు 'r'లు, రెండు 'l' కాదు (squi-rrel)."],[59,2,"Choose the correctly spelt word.","",["begar","begger","baggar","beggar"],4,"Spelling: beggar → -gar తో ముగుస్తుంది (beg + gar)."],[60,2,"Choose the correctly spelt word.","",["varandha","verandah","verendah","verndha"],2,"Spelling: verandah (వరండా)."],[61,2,"Choose the correctly spelt word.","",["Comical"," ty."],[201,8,"The School organised a ____ competition for students. Choose the option that collocates the best.","",["heavy","excellent","wonderful","fierce"],4,"fierce competition = తీవ్రమైన పోటీ."],[202,8,"The doctor advised him to get ___ exercise every day. Choose the option that collocates the best.","",["strong","regular","generous","powerful"],2,"regular exercise."],[203,8,"The teacher has a ___ knowledge of English grammar. Choose the option that collocates the best.","",["strong","heavy","wide","serious"],3,"wide knowledge = విస్తృత జ్ఞానం."],[204,8,"The students showed ___ interest Choose the option that collocates the best.","",["strong","heavy","powerful","wide"],1,"strong interest."],[205,8,"The government has taken ___ measures to improve education. Choose the option that collocates the best.","",["strong","powerful","effective","heavy"],3,"effective measures = సమర్థవంతమైన చర్యలు."],[206,8,"We should ____ a close relationship with our students. Choose the option that collocates the best.","",["do","develop","make","take"],2,"develop a relationship."],[207,8,"Can I give you a friendly ____ of advice? Choose the option that collocates the best.","",["bunch","slice","part","word"],4,"a word of advice = ఒక సలహా మాట."],[208,8,"The school provides _____ opportunities for students to develop their skills. Choose the option that collocates the best.","",["wide","large","broad","great"],4,"great opportunities."],[209,8,"Please ____ the instructions carefully before answering. Choose the option that collocates the best.","",["make","read","pay","do"],2,"read the instructions."],[210,8,"The teacher asked the students to ____ a question. Choose the option that collocates the best.","",["tell","make","ask","give"],3,"ask a question."],[211,8,"The students ____ a discussion about environmental problems. Choose the option that collocates the best.","",["made","had","did","took"],2,"have a discussion."],[212,8,"The students were ___ disappointed when the programme was h.","",["Simple Present Tense","Simple Past Tense","Present Perfect Tense","Past Perfect Tense"],1,"eats – Simple Present (అలవాటు/సాధారణ సత్యం)."],[289,12,"She dusted the chair. Choose the correct Passive Voice.","",["The chair has been dusted by her.","The chair was dusted by she.","The chair has dusted by her.","The chair was dusted by her."],4,"Past → was/were + V3. object 'her' ('she' కాదు): The chair was dusted by her."],[290,12,"He writes history books. Choose the correct Passive Voice.","",["History books is written by him.","History books are written by him.","History books were written by him.","History books had written by him."],2,"Simple Present Passive: am/is/are + V3. books బహువచనం → are written."],[291,12,"We have received the message. Choose the correct Passive Voice.","",["The message have been received by us.","The message has been received by we.","The message had been received by us.","The message has been received by us."],4,"Present Perfect Passive: has/have been + V3. message ఏకవచనం → has been; by us."],[292,12,"I had bought three books. Choose the correct Passive Voice.","",["Three books had been bought by me.","Three books have been bought by me.","Three books are being bought by me.","Three books were being bought by me."],1,"Past Perfect Passive: had been + V3."],[293,12,"We sell toys. Choose the correct Passive Voice.","",["Toys are sold by we.","Toys are sold by us","Toys were sold by us","Toys are been sold by we"],2,"Simple Present Passive: are sold; కర్తృ సర్వనామం 'we' → 'by us'."],[294,12,"Vamsi took some pictures. Choose the correct Passive Voice.","",["Some pictures were taken by Vamsi.","Some pictures are taken by Vamsi.","Some pictures have taken by Vamsi.","Some pictures had taken by Vamsi."],1,"Simple Past Passive: were taken (pictures బహువచనం)."],[295,12,"The boys are eating food. Choose the correct Passive Voice.","",["Food is been eaten by the boys.","Food has been eaten by the boys.","Food is being eaten by the boys.","Food was been eaten by the boys."],3,"Present Continuous Passive: is/are being + V3."],[296,12,"Sruthi has painted these doors. Choose the correct Passive Voice.","",["The doors have being painted by Sruthi.","These doors had been painted by Sruthi.","These doors has been painted by Sruthi.","These doors have been painted by Sruthi."],4,"Present Perfect Passive: doors బహువచనం → have been painted."],[297,12,"The teacher will praise you. Choose the correct Passive Voice.","",["You will been praised by the teacher.","You will being praised by the teacher.","You will be praised by the teacher.","You will be been praised by the teacher."],3,"Future Passive: will be + V3."],[298,12,"He had caught many snakes. Choose the correct Passive Voice.","",["Many snakes had been caught by him.","Many snakes have been caught by him.","Many snakes had been caught by he.","Many snakes has been caught by him."],1,"Past Perfect Passive: had been + V3; he → by him."],[299,12,"Kamala is drinking milk. Choose the correct Passive Voice.","",["Milk has been drunk by Kamala.","Milk are being drunk by Kamala.","Milk is being drunk by Kamala.","Milk had being drunk by Kamala."],3,"Present Continuous Passive: is being drunk."],[300,12,"The teacher was teaching a poem. Choose the correct Passive Voice.","",["A poem was being taught by the teacher.","A poem is being taught by the teacher.","A poem are being taught by the teacher.","A poem is been taught by the teacher."],1,"Past Continuous Passive: was/were being + V3."],[301,12,"Pallavi writes books. Choose the correct Passive Voice.","",["Books have written by Pallavi.","Books is written by Pallavi.","Books are written by Pallavi.","Books has written by Pallavi."],3,"Simple Present Passive: are written (books)."],[302,12,"I have played cricket. Choose the correct Passive Voice.","",["Cricket have been played by me.","Cricket has being played by me.","Cricket had been played by me.","Cricket has been played by me."],4,"Present Perfect Passive: has been played (cricket ఏకవచనం)."],[303,12,"Kiran repairs air coolers. Choose the correct Passive Voice.","",["Air coolers have been repaired by Kiran.","Air coolers are repaired by Kiran.","Air coolers are being repaired by Kiran.","Air coolers had been repaired by Kiran."],2,"Simple Present Passive: are repaired."],[304,12,"Close all the gates at once. Choose the correct Passive Voice.","",["Let all the gates be closed at once.","Let all the gates bee close at once.","Let all the gate being closed at once.","Let all the gates are be close at once."],1,"Imperative Passive: Let + object + be + V3."],[305,12,"Tagore wrote Geetanjali. Choose the correct Passive Voice.","",["Geetanjali is written by Tagore.","Geetanjali was being written by Tagore.","Geetanjali was been written by Tagore.","Geetanjali was written by Tagore."],4,"Simple Past Passive: was written."],[306,12,"Sudeep ate an apple. Choose the correct Passive Voice.","",["An apple were eaten by Sudeep.","An apple was being eaten by Sudeep","An apple was eaten by Sudeep","An apple were being eaten by Sudeep"],3,"Simple Past Passive: an apple (ఏకవచనం) → was eaten."],[307,12,"Man makes Machines. Choose the correct Passive Voice.","",["Machines had been made by man.","Machines are made by man.","Machines were made by man.","Machines have been made by man."],2,"Simple Present Passive: Machines are made by man."],[308,12,"I had bought three books. Choose the correct Passive Voice.","",["Three books are being bought by me.","Three books had been bought by me.","Three books has been bought by me.","Three books have been bought by me."],2,"Past Perfect Passive: had been bought."],[309,12,"We saw many animals in the zoo. Choose the correct Passive Voice.","",["Many animals were seen by us in the zoo.","Many animals are seen by us in the zoo.","Many animals have been seen by us in the zoo.","Many animals had been seen by us in the zoo."],1,"Simple Past Passive: were seen."],[310,12,"Close the door. Choose the correct Passive Voice.","",["Let the door be close.","Let the door been closed.","Let the door be closed.","Let the door by closed."],3,"Imperative Passive: Let the door be closed."],[311,12,"They are eating bananas. Choose the correct Passive Voice.","",["Bananas have been eaten by them.","Bananas is being eaten by them.","Bananas had been eaten by them.","Bananas are being eaten by them."],4,"Present Continuous Passive: are being + V3; bananas బహువచనం → are."],[312,12,"The dog killed the cat. Choose the correct Passive Voice.","",["The cat is killed by the dog.","The cat was killed by the dog.","The cat had killed by the dog.","The dog was killed by the cat."],2,"Simple Past Passive: The cat was killed by the dog (కర్త–కర్మ స్థానాలు మారతాయి, అర్థం కాదు)."],[313,13,"Direct: Ramya said to uncle, “What are you doing?” Indirect: Ramya asked uncle what he __ doing. Choose the correct option that fits in the blank.","",["is","were","has","was"],4,"Reported speech: are → was (tense ఒక అడుగు వెనక్కి); you → he."],[314,13,"Direct: Uncle said to Ramya, “I am making a sari.” Indirect: Uncle told Ramya that he __ making a sari. Choose the correct option that fits in the blank.","",["was","is","am","were"],1,"am → was; I → he."],[315,13,"Direct: Ramya said to uncle, “What is the price”? Indirect: Ramya asked uncle what the price ___. Choose the correct option that fits in the blank.","",["is","were","could","was"],4,"is → was. ప్రశ్నార్థకం indirect లో వాక్య క్రమంలో: what the price was."],[316,13,"Direct: Uncle said to Ramya, “Do you want to buy it?” Indirect: Uncle asked Ramya __ she wanted to buy it. Choose the correct option that fits in the blank.","",["if","what","when","that"],1,"Yes/No ప్రశ్న → if/whether."],[317,13,"Direct: Ramya said to uncle, “Can you pack it for me?” Indirect: Ramya asked uncle if he ___ pack it for her. Choose the correct option that fits in the blank.","",["can be","would be","did have","could"],4,"can → could."],[318,13,"Direct: The teacher said to Ravi, “You are absolutely right.” Indirect: The teacher told Ravi that he ___ absolutely right. Choose the correct option that fits in the blank.","",["was","were","are","could"],1,"are → was; you → he."],[319,13,"Direct: Ravi said to the teacher, “How do they know?” Indirect: Ravi asked the teacher how they ___. Choose the correct option that fits in the blank.","",["knew","known","know","knowing"],1,"do know (present) → knew (past)."],[320,13,"Direct: She said to him, “Where did you find it?” Indirect: She asked him where he ___ it. Choose the correct option that fits in the blank.","",["found","had found","will found","would found"],2,"did find (past) → had found (past perfect)."],[321,13,"Direct: The potter said to his wife, “Please tie my hands.” Indirect: The potter requested his wife to tie ___hands. Choose the correct option that fits in the blank.","",["my","your","their","his"],4,"my → his (చెప్పినవాడి వైపు నుండి)."],[322,13,"Direct: He said to her, “Look at the paper.” Indirect: He ordered her to ___ at the paper. Choose the correct option that fits in the blank.","",["looked","has looked","looking","look"],4,"Imperative → ordered + to + V1: to look."],[323,13,"Direct: The raiders said to the bank manager, “Open the safe.” Indirect: The raiders ordered the bank manager to ___ the safe. Choose the correct option that fits in the blank.","",["open","opening","has opened","had opened"],1,"ordered to + V1: to open."],[324,13,"Direct: She warned them, “Don't miss your train.” Indirect: She warned them not to __ their train. Choose the correct option that fits in the blank.","",["will miss","can miss","may miss","miss"],4,"Negative imperative → not to + V1: not to miss."],[325,13,"Direct: He begged me, “ Please do as I say.” Indirect: He begged me to do as he ___. Choose the correct option that fits in the blank.","",["says","say","said","had said"],3,"say → said."],[326,13,"Direct: He said to her, “Get out of my way.” Indirect: He ordered her to get out of __ way. Choose ive Sentence","Exclamatory Sentence"],1,"విషయం చెబుతోంది → Declarative."],[346,14,"Identify the correct negative declarative sentence.","",["She does not sell fish.","She does not sells fish.","She do not sell fish.","She do not sells fish."],1,"does not + V1 (sell). 'sells' తప్పు."],[347,14,"She told a lie. Identify the negative interrogative sentence for the above statement","",["Did she not told lie?","Do she not told a lie?","Did she not tell a lie?","Does she not told a lie?"],3,"Did she not + V1 → Did she not tell a lie?"],[348,14,"He has a car. Identify the negative interrogative sentence for the above statement","",["He does not has a car.","He does not have a car.","He do not have a car.","He do not has a car."],2,"has → does not have. (ఆప్షన్లు negative declarative రూపంలో ఉన్నాయి; కీ ప్రకారం 2.)"],[349,14,"I wear a uniform. Identify the type of sentence.","",["Declarative Sentence","Interrogative Sentence","Imperative Sentence","Exclamatory Sentence"],1,"విషయం చెబుతోంది → Declarative."],[350,14,"I quickly had my bath. Identify the type of sentence.","",["Declarative Sentence","Interrogative Sentence","Imperative Sentence","Exclamatory Sentence"],1,"Declarative."],[351,14,"Who is your English teacher? Identify the type of sentence.","",["Exclamatory Sentence","Interrogative Sentence","Imperative Sentence","Declarative Sentence"],2,"Interrogative."],[352,14,"Have you ever been to Delhi? Identify the type of sentence.","",["Assertive","Interrogative","Imperative","Declarative"],2,"Interrogative."],[353,14,"What a long queue it is! Identify the type of sentence.","",["Declarative","Interrogative","Imperative","Exclamatory"],4,"What a … ! → Exclamatory."],[354,14,"What a beautiful flower! Identify the type of sentence.","",["Assertive","Interrogative","Imperative","Exclamatory"],4,"Exclamatory."],[355,14,"Identify the Declarative Sentence.","",["What a pity!","Who is your English teacher?","They felt happy.","Close the door."],3,"They felt happy. → Declarative."],[356,14,"Where is the ghost? Identify the type of sentence.","",["Declarative","Interrogative","Imperative","Exclamatory"],2,"Interrogative."],[357,14,"Hurrah! I have won the game! Identify the type of sentence.","",["Exclamatory","Declarative","Imperative","Interrogative"],1,"Hurrah! → Exclamatory."],[358,14,"The little girl thanked them with bouquets. Identify the type of sentence.","",["Exclamatory","Imperative","Interrogative","Declarative"],4,"Declarative."],[359,14,"Can you hear anything? Identify the type of sentence.","",["Declarative","Interrogative","Imperative","Exclamatory"],2,"Interrogative."],[360,14,"Identify the Imperative sentence.","",["They will go home.","Please open the door.","She can do this sum.","He should work hard."],2,"Please open … → Imperative (అభ్యర్థన)."],[361,15,"Ram wanted to go to Simla. He went to Gaya____. Choose the correct linker.","",["so","instead","if","as"],2,"instead = బదులుగా."],[362,15,"The river had dried up. ___they decided to cancel the ferry boat. Choose the correct linker.","",["As","Also","Therefore","Instead"],3,"Therefore = కాబట్టి (కారణం → ఫలితం)."],[363,15,"It rained so much last night. _____ the Gramasabha had to be organized inside the Panchayat office. Choose the correct linker.","",["As a result","By the way","More ever","Instead"],1,"As a result = ఫలితంగా."],[364,15,"It is a beautiful day today, isn't it? ___, have you seen our English teacher? Choose the correct linker.","",["But","So","By the way","Besides"],3,"By the way = మాట మార్చేటప్పుడు (\"అన్నట్టు\")."],[365,15,"Take the case of Mr.Rao ___. He will never allow irregularity in doing job. Choose the correct linker.","",["incidentally","accidentally","consequently","for instance"],4,"for instance = ఉదాహరణకు."],[366,15,"_____ , the best thing to do is to ignore the people who discourage us. Choose the correct linker.","",["Anyway","If","Unless","Occasionally"],1,"Anyway = ఏది ఏమైనా."],[367,15,"Mrs. Rao plans to go to Kerala and on his way back he may go to Tamilnadu _____. Choose the correct linker.","",["yet","but","as well","therefore"],3,"as well = కూడా (వాక్యం చివర)."],[368,15,"Having more vehicles in the city does not mean prosperity. ____ , it means pollution. Choose the correct linker.","",["In case","On the contrary","Consequently","After that"],2,"On the contrary = దానికి విరుద్ధంగా."],[369,15,"Manas has been to Assam. He has ___ been to Manipur. Choose the correct linker.","",["also","but","yet","so"],1,"also = కూడా."],[370,15,"It has not rained well this year. ______ the seeds they bought were fake. Choose the correct linker.","",["But","Thus","Consequently","In addition to that"],4,"In addition to that = దానికి తోడు."],[371,15,"I am not going to invite Akash to my party. He doesn't talk to me. ___, he never invites me to his parties. Choose the correct linker.","",["Therefore","Thus","If","Besides"],4,"Besides = అంతేకాక."],[372,15,"Bhumi isn't lazy. ___, he is quite industrious. Choose the correct linker.","",["Consequently","On the contrary","Then","Besides"],2,"On the contrary = దానికి విరుద్ధంగా (lazy కాదు, కష్టపడేవాడు)."],[373,15,"___, there are around fifty stray dogs roaming around on the streets. ___ there are pigs which are equallydangerous. Choose the correct linker.","",["Then, Firstly","Firstly, But","Then, But","Firstly, Then"],4,"Firstly …, Then … = మొదటగా…, తర్వాత…"],[374,15,"Vivekananda faced many difficulties in his life. _____, he always had a positive Attitude towards life. Choose the correct linker.","",["So","Therefore","However","Besides"],3,"However = అయినప్పటికీ."],[375,15,"Why do you want to spend money on the house? ___, you are going to sell it. Choose the correct linker.","",["Anyway","Consequently","So","By the way"],1,"Anyway = ఎలాగూ."],[376,15,"A huge workers march was passing along the main road. ___, the traffic was divided along a different road. Choose the correct linker.","",["But","If","Consequently","Unless"],3,"Consequently = పర్యవసానంగా."],[377,15,"Indians lov ssibility","Request","Offer"],2,"may → Possibility."],[389,16,"The train may arrive late tomorrow. Identify the language function in the above sentence.","",["Offer","Past habit","Possibility","Request"],3,"may → Possibility."],[390,16,"She can dance for two hours continuously. Identify the language function in the above sentence.","",["Request","Permission","Ability","Inference"],3,"can → Ability."],[391,16,"May I take your pen? Identify the language function in the above sentence.","",["Seeking permission","Ability","Order","Suggestion"],1,"May I …? → Seeking permission."],[392,16,"May I come in, Sir? Identify the language function in the above sentence.","",["Order","Ability","Seeking permission","Suggestion"],3,"May I come in? → Seeking permission."],[393,16,"He can draw pictures very well. Identify the language function in the above sentence.","",["Ability","Permission","Request","Advice"],1,"can → Ability."],[394,16,"Would you like to have a cup of coffee? Identify the language function in the above sentence.","",["Ability","Permission","Possibility","Offer"],4,"Would you like …? → Offer."],[395,16,"You should wear helmet while driving. Identify the language function in the above sentence.","",["Advice","Possibility","Permission","Ability"],1,"should → Advice."],[396,16,"Could you lend me your pen? Identify the language function in the above sentence.","",["Request","Ability","Past habit","Possibility"],1,"Could you lend …? → Request."],[397,16,"Would you like to have some tea? Identify the language function in the above sentence.","",["Ability","Permission","Offer","Possibility"],3,"Would you like …? → Offer."],[398,16,"Will you join us for tea? Identify the language function in the above sentence.","",["Offer","Ability","Permission","Past habit"],1,"Will you join us …? → Offer (ఆహ్వానం)."],[399,16,"You may leave now. Identify the language function in the above sentence.","",["Request","Permission","Offer","Past habit"],2,"You may leave → Permission."],[400,1 ful.","Meena is a succeed."],3,"successful (విశేషణం) → Meena is successful."],[551,22,"Identify the correct sentence.","",["Rizwan still depend over his parents.","Rizwan still depends over his parents.","Rizwan still depend on his parents.","Rizwan still depends on his parents."],4,"depend on (depend over కాదు); ఏకవచనం → depends."],[552,22,"Find the correct sentence.","",["I have seen Bhaskar yesterday.","I saw Bhaskar yesterday.","I has seen Bhaskar yesterday.","I am seen Bhaskar yesterday."],2,"yesterday తో Present Perfect రాదు → Simple Past: I saw."],[553,23,"If we play tennis I will win. Identify the type of conditional.","",["Zero conditional","First conditional","Second conditional","Third conditional"],2,"If + Present, will + V1 → First conditional (సాధ్యమయ్యే భవిష్యత్తు)."],[554,23,"The letter brought money which is badly needed. Identify the type of the clause of the underlined phrase. .","",["Noun clause","Adverb clause","Adjective clause","Non- finite clause"],3,"which is badly needed – నామవాచకాన్ని (money) వర్ణిస్తుంది → Adjective clause."],[555,23,"I don't believe what he says. Identify the type of the clause of the underlined phrase. .","",["Noun clause","Adverb clause","Adjective clause","Non- finite clause"],1,"what he says – 'believe' కు కర్మ → Noun clause."],[556,23,"I remarked that it was a fine day. Identify the type of the clause of the underlined.","",["Noun clause","Adverb clause","Adjective clause","Non- finite clause"],1,"that it was a fine day – remarked కు కర్మ → Noun clause."],[557,23,"Do you know the women who is wearing a blue sari? Identify the type of the clause of the underlined.","",["Noun clause","Adverb clause","Adjective clause","Non- finite clause"],3,"who is wearing … – woman ను వర్ణిస్తుంది → Adjective clause."],[558,23,"He may go home after his work is finished. Identify the type of the clause of the underlined.","",["Noun clause","Adverb clause","Adjective clause","Non- finite clause"],2,"after his work is finished – ఎప్పుడ
